syntax = "proto3";

// LOCAL loopback contract between the Go quik-agent and the bundled Python
// robot-runner on the SAME Windows VDS (127.0.0.1 only, no auth, never exposed).
// The agent is the server. The runner consumes ticks + order events, places
// orders (re-checked by the agent's Guard), receives relayed STL control
// commands, and reports robot status (forwarded to STL by the agent).
package shectory.quik.v1;

import "shectory/quik/v1/quik_agent.proto";

option go_package = "shectory/quik/v1;quikv1";

service RunnerBridge {
  rpc StreamTicks(TickFilter) returns (stream MarketDataTick);
  rpc StreamTape(TickFilter) returns (stream TapeBatch);
  rpc PlaceRunnerOrder(PlaceOrder) returns (BridgeAck);
  rpc CancelRunnerOrder(CancelOrder) returns (BridgeAck);
  rpc StreamOrderEvents(EventsFilter) returns (stream OrderUpdate);
  rpc StreamControl(ControlHello) returns (stream RunnerControl);
  rpc ReportStatus(RobotStatusReport) returns (BridgeAck);
}

// One exchange trade from the anonymized all-trades tape (QLua OnAllTrade).
message TapeTrade {
  double price = 1;
  int64 qty = 2;
  int32 side = 3;        // 1 = sell (aggressor), 2 = buy, 0 = unknown
  int64 ts_unix_ms = 4;  // exchange/terminal trade time
}

// A batch of tape trades for one instrument (Lua flushes every ~300ms).
message TapeBatch {
  string code = 1;
  repeated TapeTrade trades = 2;
  int64 received_at_unix_ms = 3;
}

message TickFilter { repeated string codes = 1; }         // empty = all whitelisted
message EventsFilter { string client_prefix = 1; }        // runner's client_id prefix, e.g. "rr:"
message ControlHello { string runner_version = 1; int32 pid = 2; }

message RunnerControl {
  oneof payload {
    DeployRobot deploy = 1;
    UndeployRobot undeploy = 2;
    SetRobotParams set_params = 3;
    PauseRobot pause = 4;
    StartRobot start = 5;
    KillSwitch kill = 6;
    FixRobotState fix_state = 7;  // recon align: force runner state to QUIK fact
    FlattenRobot flatten = 8;     // operator: market-close whole position + pause
  }
}

message BridgeAck { bool ok = 1; string error = 2; }

// Recon align step: overwrite a robot's position/avg to the QUIK fact. clear_working
// drops the robot's belief in working orders (they were cancelled/never existed).
message FixRobotState {
  string robot_id = 1;
  int64 set_position = 2;
  double set_avg_price = 3;
  bool clear_working = 4;
  string note = 5;      // shown in the robot's journal
  // Точная правка P&L (2026-08-06: авто-хил влил вчерашние вечерние филлы и
  // испортил «реализовано» реального робота; позицию align чинит, P&L было
  // нечем). set_pnl гейтит запись — иначе нули стирали бы P&L на каждом
  // обычном align. Значения в ПУНКТАХ, как их ведёт раннер: gross до
  // комиссии + накопленная комиссия отдельно (net = gross - commission).
  bool set_pnl = 6;
  double set_realized_gross_pts = 7;
  double set_commission_pts = 8;
}
