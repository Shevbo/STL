<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>STL · мобильный компаньон</title>
<!-- Мобильный клон компаньона для телефона (iPhone и любой браузер).

     Авторизация — тем же кодом привязки, что и трей-компаньон: оператор на
     /watchdog-log.html выдаёт код для учётки (например MOBILE\iphone), сюда
     вводятся учётка и код, страница меняет их на долгий read-only токен
     (POST /api/v1/quik/companion/pair) и хранит его в localStorage. Токен
     открывает РОВНО ОДИН endpoint — snapshot, торговых действий у него нет,
     поэтому хранение в браузере телефона допустимо.

     Открытая с десктопа под STL-сессией, страница работает и без токена.

     ДВА ПРАВИЛА, которые здесь легко нарушить:

     1. СОДЕРЖИМОЕ ОДИН В ОДИН С companion.html. Панель на Windows и эта
        страница считают одни и те же деньги; любое расхождение оператор читает
        как расхождение ДАННЫХ. Правишь снапшот или карточку робота — правь ОБА
        файла (мобильный молча отставал: пропали живая котировка позиции,
        разбивка «сегодня = фикс + ВМ», горизонт годовой, тейк умной заявки).
        То, что на Windows живёт в title-подсказке, здесь выведено текстом:
        на телефоне наведения курсора нет.

     2. ССЫЛКИ ВЕДУТ ТОЛЬКО НА СВОИ ЭКРАННЫЕ ФОРМЫ (#/robot/… , #/orders,
        #/watch). Телефон, привязанный кодом, имеет токен РОВНО НА snapshot —
        любая ссылка в SPA STL для него кончается экраном логина, а сами экраны
        SPA свёрстаны под десктоп. Поэтому все подробности собраны здесь же, из
        того же снапшота. -->
<style>
  :root {
    --bg: #0f0f1e; --panel: #14142a; --bd: #2d2d4a;
    --ink: #e2e6f0; --muted: #8a90a8; --faint: #6f7590;
    --up: #2ecc71; --down: #ff6b5a; --rail: #3a3a5c;
    --accent: #4dd0e1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-text-size-adjust: 100%;
  }
  body { padding: 0 0 40px; }

  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 8px;
    background: rgba(15, 15, 30, .92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--bd);
  }
  /* Дата/день/время как на Windows-панели, целиком. В одну строку с индикатором
     связи на телефоне не влезает — отдаём заголовку всю первую строку. */
  .brand { flex: 1 0 100%; font-weight: 600; letter-spacing: .04em; font-size: 14px;
    color: inherit; text-decoration: none; }
  .fresh { flex: 1; color: var(--faint); font-size: 12px; }
  .fresh.stale { color: var(--down); }
  .logout { color: var(--faint); font-size: 12px; background: none; border: none; padding: 4px; }

  .sec {
    display: flex; align-items: center; gap: 8px;
    margin: 16px 14px 6px;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--bd); }
  .sec a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--bd);
    text-transform: none; letter-spacing: 0; }
  .sec .copy { cursor: pointer; color: var(--muted); border-bottom: 1px dotted var(--bd);
    text-transform: none; letter-spacing: 0; }
  .sec .copy.done { color: var(--up); border-color: transparent; }
  .more { cursor: pointer; color: var(--muted); border-bottom: 1px dotted var(--bd);
    text-transform: none; letter-spacing: 0; margin-left: 8px; }

  .row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 14px 5px 12px; margin: 0 8px 2px;
    border-left: 3px solid var(--rail); background: var(--panel); border-radius: 4px;
  }
  .row.up { border-left-color: var(--up); }
  .row.down { border-left-color: var(--down); }
  .row .k { color: var(--muted); }
  .row .sp { flex: 1; }
  .row .v { font-weight: 600; font-size: 17px; white-space: nowrap; }
  .v.up { color: var(--up); } .v.down { color: var(--down); } .v.nil { color: var(--faint); font-weight: 400; }
  .sub { color: var(--faint); font-size: 12px; }
  .row.total { border-left-width: 4px; }
  .row.total .k { color: var(--ink); font-weight: 600; }
  /* Живая котировка рядом с кодом инструмента (как на Windows-панели). */
  .q { color: var(--ink); font-size: 13px; font-weight: 600; }
  .q-stale { color: var(--faint); font-weight: 400; text-decoration: line-through; }

  /* Биржа: как робот-карточка — статус сверху (переносится, если длинный:
     «биржа закрыта. открытие торгов…»), «посл. сделка» мелкой строкой под ним.
     Раньше жило в одну .row и длинный статус ломал вёрстку. */
  .mkt { margin: 0 8px 6px; padding: 8px 12px;
    border-left: 3px solid var(--rail); background: var(--panel); border-radius: 4px; }
  .mkt.up { border-left-color: var(--up); }
  .mkt .hd { display: flex; align-items: baseline; gap: 8px; }
  .mkt .hd .k { color: var(--muted); }
  .mkt .hd .v { font-weight: 700; font-size: 16px; margin-left: auto; }
  .mkt .sub { margin-top: 3px; }

  .rob {
    margin: 0 8px 6px; padding: 8px 12px;
    border-left: 3px solid var(--rail); background: var(--panel); border-radius: 4px;
  }
  .rob.up { border-left-color: var(--up); } .rob.down { border-left-color: var(--down); }
  .rob .hd { display: flex; align-items: baseline; gap: 6px 8px; flex-wrap: wrap; }
  .rob .hd a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px;
    border-bottom: 1px solid var(--bd); }
  .tag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .tag.real { color: var(--down); } .tag.paused { color: var(--down); font-weight: 700; }
  .tag.off { color: var(--faint); }
  .tag.exitonly { color: #d99a3c; font-weight: 600; }
  .tag.mode.real { color: var(--down); font-weight: 700; }
  .tag.mode.paper { color: var(--muted); }
  .rob .hd .v { margin-left: auto; font-weight: 700; font-size: 17px; }
  .chg { font-size: 11px; font-weight: 600; margin-left: 4px; color: var(--faint); }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .rob .nums { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 3px; }
  .rob .nums b { color: var(--ink); font-weight: 600; }
  .rob .nums b.up { color: var(--up); } .rob .nums b.down { color: var(--down); }
  .rob .nums .dim { opacity: .75; }

  .chk { display: flex; gap: 8px; padding: 4px 14px 4px 12px; margin: 0 8px 2px;
    border-left: 3px solid var(--up); background: var(--panel); border-radius: 4px; font-size: 14px; }
  .chk.bad { border-left-color: var(--down); }
  .chk .n { color: var(--muted); min-width: 108px; flex-shrink: 0; }
  .chk .s { color: var(--up); } .chk.bad .s { color: var(--down); }
  .alert { margin: 0 8px 4px; padding: 6px 12px; border-left: 3px solid var(--down);
    background: var(--panel); border-radius: 4px; color: var(--down); font-size: 13px; line-height: 1.45; }
  .alert.ok { border-left-color: var(--up); color: var(--up); }
  .alert .at { color: var(--faint); font-size: 11px; }
  .star { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #e0a53c; margin-right: 5px; animation: sp 2s infinite; }
  @keyframes sp { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .empty { color: var(--faint); padding: 4px 22px; font-size: 14px; }

  /* Экранные формы: «назад», заголовок, копируемый идентификатор (левый верх). */
  .nav { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 0; }
  .nav a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .nav .id { margin-left: auto; color: var(--faint); font-size: 11px;
    font-family: ui-monospace, monospace; cursor: pointer; }
  .nav .id.done { color: var(--up); }
  .h1 { margin: 8px 14px 8px; font-size: 18px; font-weight: 600;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .big { margin: 0 8px 6px; padding: 10px 12px; background: var(--panel);
    border-radius: 4px; border-left: 3px solid var(--rail); }
  .big.up { border-left-color: var(--up); } .big.down { border-left-color: var(--down); }
  .big .n { font-size: 27px; font-weight: 700; line-height: 1.2; }
  .big .n.up { color: var(--up); } .big .n.down { color: var(--down); }
  /* Пояснения, которые на Windows живут в title: на телефоне наведения нет. */
  .hint { color: var(--faint); font-size: 12px; line-height: 1.45; margin: 4px 22px 12px; }

  /* Экран привязки */
  .pair { max-width: 420px; margin: 12vh auto 0; padding: 0 20px; }
  .pair h1 { font-size: 18px; letter-spacing: .06em; }
  .pair p { color: var(--muted); font-size: 14px; line-height: 1.55; }
  .pair label { display: block; margin: 14px 0 4px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); }
  .pair input {
    width: 100%; padding: 12px; font-size: 18px; border-radius: 6px;
    border: 1px solid var(--bd); background: var(--panel); color: var(--ink);
  }
  .pair input.code { letter-spacing: .3em; text-transform: uppercase; font-family: ui-monospace, monospace; }
  .pair button {
    width: 100%; margin-top: 18px; padding: 13px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 6px; background: var(--accent); color: #08222a;
  }
  .pair .err { color: var(--down); margin-top: 10px; min-height: 20px; font-size: 14px; }
  /* Кассета вместо слова-дубля. Первый тег говорит, ЧЕМ робот рискует (реал или
     бумага), второй раньше повторял то же слово: «РЕАЛ РЕАЛ». Смысл второго —
     крутится или стоит, и это лучше показывать движением: катушки видно боковым
     зрением, слово надо прочитать. Рисунок по фотографии AGFA Fe I: чёрный корпус,
     светлая этикетка с двумя полосами, окно ленты, пять отверстий снизу. */
  .cass { display: inline-flex; align-items: center; vertical-align: -3px; }
  .cass svg { width: 29px; height: 19px; }
  .cass .shell { fill: #17181a; stroke: #454a52; stroke-width: .7; }
  .cass .label { fill: #e6e2d6; }
  .cass .stripe { fill: #c0392b; }
  .cass .stripe2 { fill: #2a6ebb; }
  .cass .win { fill: #0a0b0c; stroke: #3a3f47; stroke-width: .5; }
  .cass .tape { fill: #3a2a1c; }
  .cass .hole { fill: #0a0b0c; }
  .cass .hub { transform-box: fill-box; transform-origin: center;
    animation: cassreel 1.25s linear infinite; }
  .cass .hub circle { fill: #d8d4c8; }
  .cass .hub path { stroke: #17181a; stroke-width: 1.1; stroke-linecap: round; }
  /* Стоп: катушки замерли, кассета глушится — пауза видна, но не кричит. */
  .cass.stopped { opacity: .45; filter: grayscale(1); }
  .cass.stopped .hub { animation: none; }
  @keyframes cassreel { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .cass .hub { animation: none; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
  // Кассета: катушки крутятся, пока робот работает, и замирают на паузе. Заменяет
  // второе слово «РЕАЛ», дублировавшее тег режима слева от него.
  const cassette = (playing) => `<span class="cass ${playing ? '' : 'stopped'}" title="${
      playing ? 'робот работает: считает бары и выставляет заявки'
              : 'на паузе: новые заявки не выставляются, позиция остаётся'}"><svg viewBox="0 0 30 20" aria-hidden="true"><rect class="shell" x=".5" y=".5" width="29" height="19" rx="1.8"/><rect class="label" x="2.6" y="2.2" width="24.8" height="7.2" rx=".7"/><rect class="stripe" x="2.6" y="2.2" width="24.8" height="1.1"/><rect class="stripe2" x="2.6" y="8.3" width="24.8" height="1.1"/><rect class="win" x="4.6" y="10.6" width="20.8" height="6.2" rx=".7"/><circle class="tape" cx="10.4" cy="13.7" r="2.9"/><circle class="tape" cx="19.6" cy="13.7" r="2.9"/><g class="hub"><circle cx="10.4" cy="13.7" r="1.5"/><path d="M10.4 12.2v3M8.9 13.7h3M9.3 12.6l2.2 2.2M11.5 12.6l-2.2 2.2"/></g><g class="hub"><circle cx="19.6" cy="13.7" r="1.5"/><path d="M19.6 12.2v3M18.1 13.7h3M18.5 12.6l2.2 2.2M20.7 12.6l-2.2 2.2"/></g><rect class="hole" x="7" y="18" width="1.5" height="1.2" rx=".3"/><rect class="hole" x="11.5" y="18" width="1.5" height="1.2" rx=".3"/><rect class="hole" x="16" y="18" width="1.5" height="1.2" rx=".3"/><rect class="hole" x="20.5" y="18" width="1.5" height="1.2" rx=".3"/></svg></span>`;

'use strict';
const API = '/api/v1/quik/companion';
const LS_TOKEN = 'stl_companion_token';
const LS_ACCT = 'stl_companion_account';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function rub(v, opts) {
  if (v == null || !isFinite(v)) return null;
  const n = Math.round(v);
  const sign = (opts && opts.signed && n > 0) ? '+' : (n < 0 ? '-' : '');
  return sign + Math.abs(n).toLocaleString('ru-RU') + ' ₽';
}
// Цена инструмента: НИКОГДА не округляем до целого (у BR шаг 0.01) — только
// гасим float-пыль. Правило поймано дважды, см. lib/format.ts.
function px(v) {
  return v == null || !isFinite(v) ? null
    : Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 6 });
}
function cls(v) { return v == null ? '' : (v > 0 ? 'up' : (v < 0 ? 'down' : '')); }
function val(txt, k) { return txt == null ? '<span class="v nil">—</span>'
  : `<span class="v ${k || ''}">${esc(txt)}</span>`; }
function hhmmss(ms) {
  return ms ? new Date(ms).toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow' }) : null;
}
// Последняя сделка: ЧЧ:ММ (без секунд); если НЕ сегодня — с датой ДД.ММ (МСК).
function lastTradeFmt(ms) {
  if (!ms) return null;
  const opt = { timeZone: 'Europe/Moscow' };
  const dd = new Date(ms).toLocaleDateString('ru-RU', { ...opt, day: '2-digit', month: '2-digit' });
  const nd = new Date().toLocaleDateString('ru-RU', { ...opt, day: '2-digit', month: '2-digit' });
  const hm = new Date(ms).toLocaleTimeString('ru-RU', { ...opt, hour: '2-digit', minute: '2-digit' });
  return dd === nd ? hm : (dd + ' ' + hm);
}
function dmy(ms) {
  return ms ? new Date(ms).toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow',
    day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
}
// sub здесь — ГОТОВАЯ разметка (котировка, подпись), а не текст: экранируют его
// вызывающие. Отличие от companion.html, где sub всегда текст.
function row(label, value, signValue, sub) {
  const k = cls(signValue);
  return `<div class="row ${k}"><span class="k">${esc(label)}</span>` +
    `<span class="sp"></span>${sub ? `<span class="sub">${sub}</span>` : ''}${val(value, k)}</div>`;
}

// Заголовок: STL, дата, день недели, время (МСК) — один в один с companion.html.
function brand(d, withMode) {
  const now = new Date(d && d.ts_ms ? d.ts_ms : Date.now());
  const p = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Moscow',
    day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'short',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).formatToParts(now).reduce((a, x) => (a[x.type] = x.value, a), {});
  const head = `STL · ${p.day}.${p.month}.${p.year} ${p.weekday} ${p.hour}:${p.minute}:${p.second}`;
  return withMode ? `${head} · ${marketMode(d && d.market)}` : head;
}

// next_session — полный ISO-datetime (дата+время+смещение), не голая дата;
// резать его как 'YYYY-MM-DD' (slice/split/reverse) давало мусор на 'T'/'+03:00'.
function fmtNextSession(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const opt = { timeZone: 'Europe/Moscow' };
  const dd = d.toLocaleDateString('ru-RU', { ...opt, day: '2-digit', month: '2-digit' });
  const hm = d.toLocaleTimeString('ru-RU', { ...opt, hour: '2-digit', minute: '2-digit' });
  return dd + ' ' + hm;
}

function marketMode(m) {
  if (!m) return 'биржа: н/д';
  const nxt = fmtNextSession(m.next_session);
  switch (m.phase) {
    case 'trading': return 'торги идут';
    case 'break': return 'клиринг/пауза';
    case 'pre_open': return 'до открытия';
    case 'done': return nxt ? `Биржа закрыта. Открытие торгов ${nxt}` : 'Биржа закрыта';
    case 'holiday': return nxt ? `выходной (MOEX) · след. ${nxt}` : 'выходной (MOEX)';
    default: return m.open === true ? 'торги идут' : m.open === false ? 'биржа закрыта' : 'биржа: н/д';
  }
}

function renderMarket(m) {
  if (!m) return '';
  const open = m.open;
  const lt = m.last_trade_ms ? new Date(m.last_trade_ms).toLocaleString('ru-RU',
    { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
  return `<div class="mkt ${open === true ? 'up' : ''}">` +
    `<div class="hd"><span class="k">Биржа MOEX</span>` +
    `<span class="v ${open === true ? 'up' : open === false ? '' : 'nil'}">${esc(marketMode(m))}</span></div>` +
    `<div class="sub">посл. сделка ${esc(lt)}</div></div>`;
}

function renderAccount(a) {
  if (!a || !a.has_data) return '<div class="empty">счёт: агент ещё не прислал деньги</div>';
  // «Тек. чист. поз.» это колонка cbplused из QUIK. Её отдаёт только новая Lua
  // (v2026.07.24-posvm). Пока скрипт не перезагружён в терминале — данных нет,
  // и это честно подписываем, а не рисуем прочерк как будто сломалось.
  const used = a.used == null ? '<span class="v nil">нужна перезагрузка Lua</span>' : val(rub(a.used));
  return row('Лимит откр. поз.', rub(a.limit)) +
    `<div class="row"><span class="k">Тек. чист. поз.</span><span class="sp"></span>${used}</div>` +
    row('План. чист. поз.', rub(a.planned)) +
    row('Вариац. маржа', rub(a.varmargin, { signed: true }), a.varmargin) +
    row('Биржевые сборы', rub(a.ts_comission), a.ts_comission ? -1 : 0);
}

// Живая котировка инструмента: та же разметка, что на Windows-панели (гашение
// зачёркиванием, если котировка не обновлялась больше 2 минут).
function quoteHtml(p) {
  const q = px(p && p.last);
  if (q == null) return '';
  const stale = p.quote_age_ms != null && p.quote_age_ms > 120000;
  return `<span class="q${stale ? ' q-stale' : ''}">${q}</span>`;
}

function renderPositions(list) {
  if (!list || !list.length) return '<div class="empty">позиций нет</div>';
  const sg = (v) => v == null ? '—' : (v > 0 ? '+' : '') + v;
  return list.map((p) => {
    // Разбивка: Роботы (сумма позиций роботов) + Ручные (остаток мимо STL).
    const bd = (p.robot_net != null || p.manual_net != null)
      ? `Роботы <b>${sg(p.robot_net)}</b> · Ручные <b>${sg(p.manual_net)}</b>` : sg(p.net);
    // ВМ здесь — ЧИСЛО QUIK: вариационная маржа ЗА СЕССИЮ (с последнего клиринга),
    // включая закрытые за сессию сделки. У робота ниже — ВМ ОТ ВХОДА. Это разные
    // величины, поэтому подписаны по-разному (иначе выглядит как расхождение).
    return `<div class="row ${cls(p.varmargin)}"><span class="k">${esc(p.sec)}</span>` +
      quoteHtml(p) + `<span class="sub">${bd}</span><span class="sp"></span>` +
      `<span class="sub">ВМ сессии</span>` +
      `${val(rub(p.varmargin, { signed: true }), cls(p.varmargin))}</div>`;
  }).join('');
}

function robotsTotal(list) {
  if (!list || !list.length) return '';
  // ПРАВИЛО: итог = фикс + ВМ открытых позиций (не голый фикс — иначе живой
  // минус по открытой позиции не виден).
  let fix = 0, vm = 0, today = 0, hasN = false, hasT = false;
  for (const r of list) {
    if (r.real_net != null) { fix += r.real_net; hasN = true; }
    if (r.varmargin != null) vm += r.varmargin;
    if (r.real_today != null) { today += r.real_today; hasT = true; }
  }
  const total = fix + vm;
  const split = vm ? `фикс ${rub(fix, { signed: true })} · ВМ ${rub(vm, { signed: true })}`
                   : `сегодня ${hasT ? rub(today, { signed: true }) : '—'}`;
  return `<div class="row total ${cls(hasN ? total : null)}">` +
    `<span class="k">Итог реал (${list.length})</span><span class="sp"></span>` +
    `<span class="sub">${esc(split)}</span>` +
    `${val(hasN ? rub(total, { signed: true }) : null, cls(total))}</div>`;
}

function renderRobots(all) {
  if (!all || !all.length) return '<div class="empty">реальных роботов нет</div>';
  const active = all.filter((r) => r.state === 'реал' || r.state === 'пауза');
  const retired = all.filter((r) => r.state !== 'реал' && r.state !== 'пауза');
  let out = renderActive(active);
  if (retired.length) {
    let net = 0, hasN = false;
    for (const r of retired) if (r.real_net != null) { net += r.real_net; hasN = true; }
    out += `<div class="row ${cls(hasN ? net : null)}">` +
      `<span class="k">Выведены из реала (${retired.length})</span>` +
      `<span class="sub">итог их реальной торговли</span><span class="sp"></span>` +
      `${val(hasN ? rub(net, { signed: true }) : null, cls(net))}</div>`;
  }
  return out;
}

// Вторую составляющую дня НЕЛЬЗЯ звать просто «ВМ»: у робота БЕЗ позиции это
// читается как бред («откуда ВМ, если позиции час нет?»). А величина честная —
// это изменение НЕреализованной части за день: у робота с позицией её переоценка,
// у закрывшегося — снятие вчерашнего переноса.
function vmLabel(r) { return r.position ? 'ВМ откр. поз.' : 'снятие вчерашней ВМ'; }
function vmHint(r) {
  return r.position
    ? 'Изменение нереализованного результата открытой позиции ЗА СЕГОДНЯ (не вся её ВМ от входа, а только сегодняшняя часть).'
    : 'Робот сейчас без позиции. Это ВМ, перенесённая со вчера: вчера он ушёл в ночь с открытой позицией, её нереализованный результат сегодня снялся. Без этой части день был бы посчитан неверно: вчерашний бумажный минус попал бы в сегодняшний фикс второй раз.';
}
// Строка «сегодня» с разбивкой — один в один с Windows-панелью.
function todayCell(r) {
  const tSum = r.today_total;
  if (r.vm_today == null) {
    return `<span>сегодня <b class="${cls(r.real_today)}">${r.real_today == null ? '—' : rub(r.real_today, { signed: true })}</b>`
      + `<span class="dim"> фикс · ${vmLabel(r)} н/д</span></span>`;
  }
  return `<span>сегодня <b class="${cls(tSum)}">${rub(tSum, { signed: true })}</b>`
    + `<span class="dim"> = фикс ${rub(r.real_today, { signed: true })}`
    + ` · ${vmLabel(r)} ${rub(r.vm_today, { signed: true })}</span></span>`;
}
// Горизонт рядом с годовой: на 7 днях истории ×52 даёт ±1800%, и без подписи
// это читается как баг, а не как экстраполяция.
function annDays(r) {
  return r.started_ms ? Math.max(1, Math.round((Date.now() - r.started_ms) / 86400000)) : null;
}

function renderActive(list) {
  if (!list.length) return '';
  return list.map((r) => {
    // ПРАВИЛО: фин.рез в заголовке = фикс + ВМ открытой позиции, не голый фикс
    // (иначе живая позиция в минусе рисует карточку так, будто всё в порядке).
    const net = r.real_total != null ? r.real_total : r.real_net;
    const k = cls(net);
    const last = lastTradeFmt(r.last_trade_ms);
    const st = r.state;
    const stCls = st === 'пауза' ? 'paused' : (st === 'реал' ? 'real' : 'off');
    // Режим отдельным тегом: «пауза» сама по себе не говорит, реал это или бумага.
    const modeTag = r.mode
      ? `<span class="tag mode ${r.mode}">${r.mode === 'real' ? 'реал' : 'бумага'}</span>` : '';
    const exitTag = r.exit_only ? '<span class="tag exitonly">только на выход</span>' : '';
    const ann = r.ann_pct == null ? null : (r.ann_pct > 0 ? '+' : '') + r.ann_pct.toFixed(1) + '%';
    const days = annDays(r);
    const chg = r.chg_pct == null ? ''
      : `<span class="chg ${cls(r.chg_pct)}">${r.chg_pct > 0 ? '+' : ''}${r.chg_pct.toFixed(1)}%</span>`;
    return `<div class="rob ${k}">
      <div class="hd">
        <a href="#/robot/${encodeURIComponent(r.id)}">${esc(r.name)}</a>
        ${modeTag}
        ${st === 'реал' || st === 'пауза'
          ? cassette(st === 'реал')
          : `<span class="tag ${stCls}">${esc(st)}</span>`}
        ${exitTag}
        ${val(rub(net, { signed: true }), k)}
        ${chg}
      </div>
      <div class="nums">
        <span>итого фикс <b class="${cls(r.real_net)}">${rub(r.real_net, { signed: true })}</b>${r.varmargin ? ` · ВМ <b class="${cls(r.varmargin)}">${rub(r.varmargin, { signed: true })}</b>` : ''}</span>
        ${todayCell(r)}
        ${r.position == null ? '' : `<span>поз <b class="${cls(r.position)}">${r.position}</b>${r.max_position ? ` из <b>${r.max_position}</b>` : ''}</span>`}
        ${ann == null ? '' : `<span>год <b class="${cls(r.ann_pct)}">${ann}</b>${days ? ` <span class="dim">за ${days} дн</span>` : ''}</span>`}
        <span>сделок сегодня <b>${r.real_trades_today || 0}</b></span>
        <span>${last ? 'посл. ' + last : 'реальных сделок нет'}</span>
      </div>
    </div>`;
  }).join('');
}

function renderWatch(w) {
  if (!w) return '<div class="empty">нет данных</div>';
  const bt = w.backtests || {}, pl = w.platform || {}, i9 = pl.i9;
  const one = (name, blk, extra) => {
    const bad = blk && blk.ok === false;
    const txt = bad ? (blk.issues || []).join('; ') : 'ОК' + (extra ? ' · ' + extra : '');
    return `<div class="chk ${bad ? 'bad' : ''}"><span class="n">${esc(name)}</span>` +
      `<span class="s">${esc(txt)}</span></div>`;
  };
  // Кандидат перебора: ссылку на кампанию в Ботсторе не даём — Ботстор свёрстан
  // под десктоп, а телефон с токеном компаньона туда всё равно не пустят. Все
  // цифры кандидата уже в самой строке.
  let star = '';
  if (bt.star) {
    const s2 = bt.star;
    star = `<div class="chk"><span class="n"><span class="star"></span>кандидат</span>` +
      `<span class="s">${esc(s2.strategy)} · ${esc(s2.symbol)}: ` +
      `+${Number(s2.net).toLocaleString('ru-RU')} ₽, RF ${esc(s2.rf)}, ${esc(s2.trades)} сд. ` +
      `<span class="sub">(кампания ${esc(s2.campaign)})</span></span></div>`;
  }
  return one('раннер + lua', w.runner) +
    one('бэктесты', bt, `в работе ${bt.running || 0} · ждут ${bt.queued || 0}`) +
    one('платформа', pl, 'LA ' + (pl.hoster && pl.hoster.load != null ? pl.hoster.load : '—') +
      ' · i9 ' + (i9 ? (i9.stale ? 'молчит' : (i9.cpu_pct != null ? i9.cpu_pct + '%' : 'он')) : 'н/д')) +
    star;
}

// #6 ручные заявки: простые (таблица QUIK, без тега = ручной класс) и умные
// (книга STL). Только статус чтения — действия в терминале STL.
// Полночь по Москве: таблица сделок QUIK держит только текущую сессию, поэтому
// вчерашним заявкам цену уже не найти — им честнее оставить уровень.
function todayLo(d) {
  const now = new Date(d && d.ts_ms ? d.ts_ms : Date.now());
  const msk = new Date(now.getTime() + (now.getTimezoneOffset() + 180) * 60000);
  msk.setHours(0, 0, 0, 0);
  return msk.getTime() - (now.getTimezoneOffset() + 180) * 60000;
}

function renderOrders(o, d) {
  if (!o || (!(o.manual || []).length && !(o.smart || []).length))
    return '<div class="empty">ручных заявок нет</div>';
  const sideRu = (s) => s === 'buy' ? 'покупка' : 'продажа';
  const num = (v) => v == null ? '—' : Number(v).toLocaleString('ru-RU');
  let out = '';
  for (const m of o.manual || []) {
    out += `<div class="row"><span class="k">${esc(m.sec)} ${sideRu(m.side)} ${m.qty}</span>` +
      `<span class="sub">@ ${num(m.price)}${m.active && m.balance < m.qty ? ` · осталось ${m.balance}` : ''}</span>` +
      `<span class="sp"></span><span class="v ${m.active ? 'up' : 'nil'}">${esc(m.state)}</span></div>`;
  }
  const KIND = { sl: 'SL', tp: 'TP', trail_tp: 'TRAIL', on_fill: 'по сделке' };
  const ST = { armed: 'взведена', fired: 'сработала', cancelled: 'снята',
    expired: 'истекла', orphaned: 'осиротела', error: 'ошибка' };
  for (const s of o.smart || []) {
    // У СРАБОТАВШЕЙ заявки показываем ЦЕНУ СДЕЛКИ, а не уровень срабатывания:
    // уровень уже история, а оператору нужен факт — по чём вошёл.
    let sub = s.trigger ? `уровень ${num(s.trigger)}` : '';
    if (s.fired_price) sub = `сделка по ${px(s.fired_price)}${s.fired_qty ? ' × ' + s.fired_qty : ''}`;
    else if ((s.status === 'fired' || s.status === 'orphaned') && s.fired_ms > todayLo(d))
      sub = 'цена сделки уточняется';   // сегодняшнюю подтянем из таблицы сделок QUIK
    if (s.sl_offset) sub += ` · стоп ${s.sl_offset} п.`;
    if (s.tp_offset) sub += ` · тейк ${s.tp_offset} п.`;
    if (s.kind === 'trail_tp' && s.status === 'armed') {
      sub = s.activated
        ? `● от пика ${num(s.peak)}, сделка при ${s.side === 'buy' ? '≥' : '≤'} ` +
          num(s.side === 'buy' ? s.peak + s.trail_offset : s.peak - s.trail_offset)
        : `ждёт пробоя ${num(s.trigger)}`;
    }
    const live = s.status === 'armed';
    out += `<div class="row"><span class="k">умная ${KIND[s.kind] || s.kind} · ${esc(s.code)} ${sideRu(s.side)} ${s.qty}</span>` +
      `<span class="sub">${esc(sub)}</span><span class="sp"></span>` +
      `<span class="v ${live ? (s.activated ? 'up' : '') : 'nil'}">${esc(ST[s.status] || s.status)}</span></div>`;
  }
  return out;
}

// Уведомления схлопнуты до ПОСЛЕДНЕГО — остальные раскрываются стрелкой.
let alertsOpen = false;
function renderAlerts(a, all) {
  if (!a) return '';
  const items = a.items || [];   // свежие сверху, ok = норма (зелёная)
  if (!items.length) return '<div class="empty">тихо, эскалаций нет</div>';
  const shown = (all || alertsOpen) ? items : items.slice(0, 1);
  return shown.map((it) => `<div class="alert ${it.ok ? 'ok' : ''}">` +
    `<span class="at">${esc(hhmmss(it.ts_ms) || '')}</span> ${esc(it.text)}</div>`).join('');
}
function alertsToggle(a) {
  const n = ((a && a.items) || []).length;
  if (n <= 1) return '';
  return `<span class="more" id="moreAlerts">${alertsOpen ? '▴' : '▾'} ${alertsOpen ? 'свернуть' : 'ещё ' + (n - 1)}</span>`;
}

// Текст для буфера: контекст, не только сырые SMS.
function alertsText(d) {
  const L = [brand(d, true)];
  const paused = (d.robots || []).filter((r) => r.state === 'пауза').map((r) => r.name);
  if (paused.length) L.push('на паузе (реал): ' + paused.join(', '));
  const exitOnly = (d.robots || []).filter((r) => r.exit_only).map((r) => r.name);
  if (exitOnly.length) L.push('только на выход: ' + exitOnly.join(', '));
  const w = d.watch || {};
  for (const [name, blk] of [['раннер+lua', w.runner], ['бэктесты', w.backtests], ['платформа', w.platform]]) {
    if (blk && blk.ok === false && (blk.issues || []).length) L.push(name + ': ' + blk.issues.join('; '));
  }
  const a = d.alerts || {};
  (a.unresolved || []).forEach((t) => L.push('не решено: ' + t));
  (a.sms_today || []).forEach((t) => L.push('SMS: ' + t));
  if (L.length === 1) L.push('всё в норме, эскалаций нет');
  return L.join('\n');
}
async function copyText(btn, text, done) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch { /**/ }
  const was = btn.textContent;
  if (btn) { btn.textContent = ok ? (done || 'скопировано') : 'не вышло'; btn.classList.toggle('done', ok); }
  setTimeout(() => { if (btn) { btn.textContent = was; btn.classList.remove('done'); } }, 1600);
}

// ── экраны ────────────────────────────────────────────────────────────────────
// Шапка одна на все экраны: индикатор связи tick() ищет по id, поэтому она
// обязана быть в разметке КАЖДОГО экрана.
function head(d) {
  return `<div class="top">
      <a class="brand" id="brand" href="#/">${esc(brand(d))}</a>
      <span class="fresh" id="fresh">●</span>
      <button class="logout" title="Отвязать телефон">отвязать</button>
    </div>`;
}
// «Назад» + копируемый идентификатор экрана в левом/правом верху.
function nav(id) {
  return `<div class="nav"><a href="#/">‹ панель</a>` +
    (id ? `<span class="id" data-copy="${esc(id)}">${esc(id)}</span>` : '') + `</div>`;
}

function paintPanel(d) {
  $('app').innerHTML = head(d) + `
    <div class="sec">биржа</div>${renderMarket(d.market)}
    <div class="sec">счёт</div>${renderAccount(d.account)}
    <div class="sec">позиции</div>${renderPositions(d.positions)}
    <div class="sec">роботы (реал)</div>
      ${robotsTotal(d.robots)}${renderRobots(d.robots)}
    <div class="sec">заявки ручные <a href="#/orders">подробно ↗</a></div>${renderOrders(d.orders, d)}
    <div class="sec">вотчер <a href="#/watch">подробно ↗</a></div>${renderWatch(d.watch)}
    <div class="sec">уведомления <a href="#/watch">детали ↗</a>
      <span class="sp" style="flex:1"></span><span class="copy" id="copyAlerts">копировать</span>
      ${alertsToggle(d.alerts)}</div>${renderAlerts(d.alerts)}`;
}

// Карточка робота — мобильная экранная форма вместо десктопного стенда STL:
// те же числа, что на панели, плюс расшифровки, которые на Windows живут в
// подсказках. Управления здесь нет и быть не может: токен компаньона умеет
// только читать снапшот.
function paintRobot(d, id) {
  const r = (d.robots || []).find((x) => x.id === id);
  if (!r) {
    $('app').innerHTML = head(d) + nav(id) +
      '<div class="empty">робот не найден в снапшоте (снят с агента или переименован)</div>';
    return;
  }
  const net = r.real_total != null ? r.real_total : r.real_net;
  const k = cls(net);
  const pos = (d.positions || []).find((p) => p.sec === r.symbol);
  const ann = r.ann_pct == null ? null : (r.ann_pct > 0 ? '+' : '') + r.ann_pct.toFixed(1) + '%';
  const days = annDays(r);
  const chg = r.chg_pct == null ? ''
    : `<span class="chg ${cls(r.chg_pct)}">${r.chg_pct > 0 ? '+' : ''}${r.chg_pct.toFixed(1)}% к вчера</span>`;
  const modeTag = r.mode
    ? `<span class="tag mode ${r.mode}">${r.mode === 'real' ? 'реал' : 'бумага'}</span>` : '';
  const exitTag = r.exit_only ? '<span class="tag exitonly">только на выход</span>' : '';
  const stTag = (r.state === 'реал' || r.state === 'пауза')
    ? cassette(r.state === 'реал')
    : `<span class="tag off">${esc(r.state)}</span>`;
  const todayVal = r.vm_today == null ? r.real_today : r.today_total;
  const todaySub = r.vm_today == null
    ? `фикс · ${vmLabel(r)} н/д`
    : `фикс ${rub(r.real_today, { signed: true })} · ${vmLabel(r)} ${rub(r.vm_today, { signed: true })}`;
  $('app').innerHTML = head(d) + nav(r.id) + `
    <div class="h1">${esc(r.name)} ${modeTag} ${stTag} ${exitTag}</div>
    <div class="big ${k}">
      <div class="sub">фин. результат = фикс по закрытым + ВМ открытой позиции</div>
      <div class="n ${k}">${esc(rub(net, { signed: true }) || '—')} ${chg}</div>
    </div>
    ${row('Итого фикс', rub(r.real_net, { signed: true }), r.real_net)}
    ${row('ВМ откр. позиции', rub(r.varmargin, { signed: true }), r.varmargin)}
    ${row('Сегодня', rub(todayVal, { signed: true }), todayVal, esc(todaySub))}
    <div class="hint">Результат за сегодня = закрытые сделки за сегодня + изменение
      нереализованной части за сегодня. ${esc(vmHint(r))}</div>
    ${row('Позиция', r.position == null ? null
        : String(r.position) + (r.max_position ? ' из ' + r.max_position : ''), r.position)}
    ${row('Инструмент', r.symbol || '—', null,
        pos ? quoteHtml(pos) + (pos.varmargin != null
          ? ` <span class="sub">ВМ сессии ${esc(rub(pos.varmargin, { signed: true }))}</span>` : '') : '')}
    ${row('Сделок сегодня', String(r.real_trades_today || 0))}
    ${row('Последняя сделка', lastTradeFmt(r.last_trade_ms) || 'реальных сделок нет')}
    ${row('Доходность в год', ann, r.ann_pct, days ? esc('за ' + days + ' дн') : '')}
    <div class="hint">Годовая линейно экстраполирована с ${days || '—'} дн к максимальному
      задействованному ГО${r.max_go ? ' ' + Math.round(r.max_go).toLocaleString('ru-RU') + ' ₽' : ''}
      (биржевое ГО × брокерский множитель). На коротком горизонте число мало о чём говорит.</div>
    ${row('Реалом торгует с', dmy(r.started_ms))}`;
}

function paintOrders(d) {
  $('app').innerHTML = head(d) + nav(null) + `
    <div class="h1">Ручные заявки</div>
    <div class="hint">Только чтение: заявки оператора (без тега робота) из таблицы QUIK
      и умные заявки из книги STL. Пока STL лежит, умные заявки не срабатывают.</div>
    <div class="sec">заявки</div>${renderOrders(d.orders, d)}
    <div class="sec">позиции</div>${renderPositions(d.positions)}
    <div class="sec">счёт</div>${renderAccount(d.account)}`;
}

function paintWatch(d) {
  const a = d.alerts || {};
  const list = (arr, empty) => (arr && arr.length)
    ? arr.map((t) => `<div class="alert">${esc(t)}</div>`).join('')
    : `<div class="empty">${empty}</div>`;
  $('app').innerHTML = head(d) + nav(null) + `
    <div class="h1">Вотчер и уведомления</div>
    <div class="sec">проверки</div>${renderWatch(d.watch)}
    <div class="sec">эскалации сегодня
      <span class="sp" style="flex:1"></span><span class="copy">копировать</span></div>
      ${renderAlerts(a, true)}
    <div class="sec">не решено</div>${list(a.unresolved, 'всё закрыто')}
    <div class="sec">SMS сегодня (${a.sms_count || 0})</div>${list(a.sms_today, 'SMS не было')}
    <div class="hint">Последний прогон вотчера: ${esc(hhmmss(a.last_run_ms) || 'н/д')} МСК.</div>`;
}

function paintPairing(msg) {
  $('app').innerHTML = `
    <div class="pair">
      <h1>STL · привязка телефона</h1>
      <p>На странице вотчера STL нажмите «Добавить компаньона», укажите учётку
         (например <b>MOBILE\\iphone</b>) и получите код. Введите их здесь —
         спрашивается один раз, доступ только на чтение.</p>
      <label>Учётка (как при выдаче кода)</label>
      <input id="acct" autocomplete="off" spellcheck="false"
             value="${esc(localStorage.getItem(LS_ACCT) || 'MOBILE\\iphone')}">
      <label>Код привязки</label>
      <input id="code" class="code" maxlength="8" autocomplete="one-time-code"
             spellcheck="false" placeholder="••••••••">
      <button id="go">Привязать</button>
      <div class="err" id="err">${esc(msg || '')}</div>
    </div>`;
  $('code').focus();
  const submit = async () => {
    $('err').textContent = '';
    const account = $('acct').value.trim();
    const code = $('code').value.trim().toUpperCase();
    if (!account || code.length < 4) { $('err').textContent = 'Заполните учётку и код.'; return; }
    try {
      const r = await fetch(API + '/pair', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, account, machine: 'mobile-web' }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.token) { $('err').textContent = d.detail || ('HTTP ' + r.status); return; }
      localStorage.setItem(LS_TOKEN, d.token);
      localStorage.setItem(LS_ACCT, account);
      start();
    } catch (e) { $('err').textContent = String(e); }
  };
  $('go').onclick = submit;
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
}

// Маршрут в хэше: экран переживает перерисовку каждые 5 секунд и уезжает в
// историю телефона, поэтому системное «назад» работает само.
function paint(d) {
  const h = (location.hash || '#/').slice(1);
  if (h.startsWith('/robot/')) paintRobot(d, decodeURIComponent(h.slice(7)));
  else if (h === '/orders') paintOrders(d);
  else if (h === '/watch') paintWatch(d);
  else paintPanel(d);
}

// Клики делегированы на документ: #app перерисовывается целиком каждый тик.
let lastData = null;
document.addEventListener('click', (e) => {
  const copy = e.target.closest('.copy');
  if (copy) { copyText(copy, alertsText(lastData || {})); return; }
  const idEl = e.target.closest('.id[data-copy]');
  if (idEl) { copyText(idEl, idEl.dataset.copy); return; }
  if (e.target.closest('.logout')) {
    if (confirm('Отвязать телефон от STL? Понадобится новый код.')) {
      localStorage.removeItem(LS_TOKEN); location.reload();
    }
    return;
  }
  if (e.target.closest('.more')) { alertsOpen = !alertsOpen; if (lastData) paint(lastData); }
});
window.addEventListener('hashchange', () => {
  if (lastData) { paint(lastData); window.scrollTo(0, 0); }
});

let lastGood = 0;
let timer = null;
async function tick() {
  const token = localStorage.getItem(LS_TOKEN);
  const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
  try {
    const r = await fetch(API + '/snapshot', { headers, cache: 'no-store',
      credentials: token ? 'omit' : 'same-origin' });
    if (r.status === 401) {
      // токен отозван (или сессии нет) — обратно на привязку
      clearInterval(timer); timer = null;
      localStorage.removeItem(LS_TOKEN);
      paintPairing(token ? 'Доступ отозван — привяжите телефон заново.' : '');
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    lastGood = d.ts_ms || Date.now();
    lastData = d;
    paint(d);
    // Время уже в заголовке; здесь индикатор связи + пинг агент<->QUIK.
    $('fresh').className = 'fresh';
    $('fresh').textContent = '● на связи' + (d.ping_ms != null ? ' (' + d.ping_ms + ' мс)' : '');
  } catch (e) {
    const f = $('fresh');
    if (f) { f.className = 'fresh stale';
      f.textContent = lastGood ? '● нет связи · ' + hhmmss(lastGood) : '● нет связи'; }
  }
}

function start() {
  tick();
  if (!timer) timer = setInterval(tick, 5000);
}

if (localStorage.getItem(LS_TOKEN)) start();
else {
  // Возможно, открыто с десктопа под STL-сессией — пробуем без токена.
  fetch(API + '/snapshot', { cache: 'no-store', credentials: 'same-origin' })
    .then((r) => { if (r.ok) start(); else paintPairing(''); })
    .catch(() => paintPairing(''));
}
</script>
