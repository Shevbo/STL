<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Страница живёт в WebView2 и в браузере. Без этого браузер эвристически
     кэшировал её и после деплоя панель считала по СТАРОМУ коду (27.07). -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>STL Companion</title>
<!-- Панель компаньона (трей-приложение STLCompanion.exe).

     Живёт внутри WebView2 без рамки окна: фон рисует DWM (тёплая бумага, 50%),
     здесь фон ПРОЗРАЧНЫЙ, иначе окно станет глухим. Данные — один запрос
     /snapshot к локальному прокси компаньона, который подставляет токен.
     Страницу можно открыть и в обычном браузере (тогда работает сессия STL):
     https://stl.shectory.ru/companion.html — удобно править вёрстку.

     СОДЕРЖИМОЕ ОБЯЗАНО СОВПАДАТЬ С frontend/public/m.html (мобильный компаньон):
     это одна панель на двух экранах, любое расхождение цифр оператор читает как
     расхождение данных. Правишь снапшот или карточку робота — правь ОБА файла.

     Шрифты только системные: Bahnschrift (узкий DIN, подписи) и Consolas
     (табличные цифры). Никаких веб-шрифтов — страница грузится через прокси
     на 127.0.0.1 и внешние запросы туда не ходят. -->
<style>
  :root {
    /* Фон полупрозрачный, поэтому реальная подложка зависит от того, что за
       окном. Приглушённые тона держим ТЁМНЫМИ: светло-серая подпись на 50%
       фоне поверх тёмного стола перестаёт читаться — проверено на стенде. */
    --ink: #1a1815;
    --muted: #4a453d;
    --faint: #6b655b;
    --rule: rgba(26, 24, 21, .22);
    --up: #15571a;
    --down: #8d1a1a;
    --rail-flat: rgba(26, 24, 21, .22);
    --chip-bg: rgba(247, 243, 236, .88);
    --pad: 11px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    /* Тёплую подложку рисует композитор Windows (DWM, ~50%). Поверх кладём ещё
       один слой бумаги: вместе даёт ~70% непрозрачности — оператор просил меньше
       прозрачности ради читаемости. В браузере (правка вёрстки) слой работает
       сам по себе. */
    background: rgba(247, 243, 236, .4);
    color: var(--ink);
    /* Сжатый в ширину шрифт (Bahnschrift — condensed, есть в Win10): панель уже на ~30%.
       tabular-nums держит цифры моноширинными, колонки значений не пляшут. */
    font: 12px/1.45 Bahnschrift, "Segoe UI", "Segoe UI Semilight", sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    cursor: default;
    user-select: none;
  }
  body { padding: 8px var(--pad) 10px; }

  /* Шапка: имя, свежесть, спрятать, выход. */
  .top { display: flex; align-items: baseline; gap: 7px; margin-bottom: 6px; }
  /* Панель таскается за любое свободное место — но только внутри компаньона:
     в браузере двигать нечего, и курсор «переместить» там был бы враньём. */
  body.draggable { cursor: move; }
  body.draggable .btn, body.draggable .copy, body.draggable .more,
  body.draggable a, body.draggable [data-dens] { cursor: pointer; }
  /* Заголовок теперь несёт дату/день/время/режим биржи — читаемая строка, не
     разрядка капсом. */
  .brand {
    flex: 1; font: 400 12px/1.2 Bahnschrift, "Segoe UI Semilight", sans-serif;
    letter-spacing: .02em; color: var(--muted);
    text-decoration: none; cursor: pointer;
  }
  .brand:hover { color: var(--ink); }
  .fresh { color: var(--faint); font-size: 10px; letter-spacing: .04em; white-space: nowrap; }
  .fresh.stale { color: var(--down); }
  /* Сама лампа — цветом: зелёная на связи, красная без связи. Текст остаётся
     приглушённым, чтобы шапка не кричала. Оттенки СВЕТЛЕЕ денежных: --up/--down
     подобраны под текст, и точка 10px ими читалась как серая. */
  .fresh .lamp { color: #1d8b28; font-size: 13px; line-height: 1; vertical-align: -1px; }
  .fresh.stale .lamp { color: #cc2222; }
  .btn {
    font: 400 15px/1 "Segoe UI", sans-serif; color: var(--faint);
    cursor: pointer; padding: 0 3px;
  }
  .btn:hover { color: var(--ink); }
  .btn.quit:hover { color: var(--down); }

  /* Заголовок секции: подпись, дальше волосяная линия до края. */
  .sec {
    display: flex; align-items: center; gap: 6px;
    margin: 9px 0 3px;
    font: 400 12px/1 Bahnschrift, "Segoe UI Semilight", sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .sec a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--rule);
    text-transform: none; letter-spacing: 0; }
  .sec a:hover { color: var(--ink); }
  /* «копировать» в шапке уведомлений: выглядит как ссылка, но это действие. */
  .sec .copy { cursor: pointer; color: var(--muted); border-bottom: 1px dotted var(--rule);
    text-transform: none; letter-spacing: 0; }
  .sec .copy:hover { color: var(--ink); }
  .sec .copy.done { color: var(--up); border-color: transparent; }

  /* Рельс слева — фирменный элемент: столбик знаковых отметок на всю панель. */
  .row {
    display: flex; align-items: baseline; gap: 6px;
    padding: 1px 0 1px 6px;
    border-left: 2px solid var(--rail-flat);
  }
  .row.up { border-left-color: var(--up); }
  .row.down { border-left-color: var(--down); }
  .row .k { color: var(--muted); white-space: nowrap; }
  .row .sp { flex: 1; }
  /* Цифры — главное на панели: крупнее подписей и полужирные. */
  .row .v { white-space: nowrap; font-weight: 600; font-size: 14px; }
  .v.up { color: var(--up); }
  .v.down { color: var(--down); }
  .v.nil { color: var(--faint); font-weight: 400; }
  /* Живая котировка рядом с кодом инструмента. Мельче значения, но чётче подписи. */
  .q { color: var(--ink); font-size: 11px; font-weight: 600; }
  .q-stale { color: var(--faint); font-weight: 400; text-decoration: line-through; }
  .sub { color: var(--faint); font-size: 10px; }
  /* Итоговая строка по роботам: жирнее рамка, чтобы читалась как сумма. */
  .row.total { border-left-width: 3px; margin-top: 2px; padding-top: 2px; }
  .row.total .k { color: var(--ink); }

  /* Биржа: статус — не число, а иногда целая фраза («биржа закрыта. открытие
     торгов…»). В одну строку с меткой и «посл. сделка» она не помещалась и
     обрезалась (body has overflow:hidden) — было криво. Теперь карточка как у
     робота: строка метка+статус (статус переносится, если не влез), и «посл.
     сделка» отдельной мелкой строкой под ней. */
  .mkt { padding: 1px 0 2px 6px; border-left: 2px solid var(--rail-flat); margin-top: 2px; }
  .mkt.up { border-left-color: var(--up); }
  .mkt .hd { display: flex; align-items: baseline; gap: 6px; }
  .mkt .hd .k { color: var(--muted); white-space: nowrap; }
  .mkt .hd .sp { flex: 1; }
  .mkt .hd .v { font-weight: 600; font-size: 14px; }
  .mkt .sub { display: block; margin-top: 1px; }

  /* Робот: две строки — имя со ссылкой, под ней цифры. */
  /* Робот: две строки БЕЗ воздуха между ними — оператор читает их как одну
     карточку. Межстрочный интервал одинарный (в body он 1.45 «для прозы»). */
  .rob { padding: 1px 0 2px 6px; border-left: 2px solid var(--rail-flat); margin-top: 2px;
    line-height: 1.5; }
  .rob.up { border-left-color: var(--up); }
  .rob.down { border-left-color: var(--down); }
  .rob .hd { display: flex; align-items: baseline; gap: 0 6px; flex-wrap: wrap; line-height: 1.5; }
  .rob a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule);
    font-size: 13px; }
  .rob a:hover { border-bottom-color: var(--ink); }
  .rob .hd .v { font-size: 14px; }
  .tag {
    font: 400 10px/1 Bahnschrift, sans-serif; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint);
  }
  .tag.real { color: var(--down); }
  /* Пауза — важный маркер: реал на паузе значит защита сработала. Выделяем. */
  .tag.paused { color: var(--down); font-weight: 600; }
  /* Переведён в бумагу / снят — уже не рискует реалом, приглушаем. */
  .tag.off { color: var(--faint); }
  /* Только на выход — режим поверх реала, риск сворачивается. Ярче приглушённого,
     но не как пауза: робот ещё работает. */
  .tag.exitonly { color: #8a5a12; font-weight: 600; }
  /* Режим: чем робот рискует прямо сейчас. Реал выделяем, бумагу приглушаем. */
  .tag.mode.real { color: var(--down); font-weight: 700; }
  .tag.mode.paper { color: var(--muted); }
  /* gap здесь был общий: при переносе строки row-gap 9px рвал карточку — вторая
     строка цифр отходила дальше, чем первая от имени. Разводим: по горизонтали
     9px, по вертикали 0, ритм держит line-height (он же у имени). */
  .rob .nums { display: flex; gap: 0 9px; flex-wrap: wrap; color: var(--muted); font-size: 11px;
    line-height: 1.5; }
  .rob .nums b { font-weight: 600; color: var(--ink); }
  /* Знак деньгам — цветом: без этого .rob .nums b перекрывал .up/.down
     специфичностью и фикс/ВМ/сегодня печатались нейтральными. */
  .rob .nums b.up { color: var(--up); }
  .rob .nums b.down { color: var(--down); }
  /* Мини-график: полчаса минуток шириной ровно в панель, высотой с текстовый
     блок робота. Раскрывается кликом по карточке. */
  .rob[data-rid] { cursor: pointer; }
  .rob .chev { color: var(--faint); font-size: 9px; }
  .rob:hover .chev { color: var(--ink); }
  /* Рамка едва заметная: она отделяет виджет от цифр, но не спорит с ними.
     Рамка на ОБЁРТКЕ, а не на холсте: статусная строка входит внутрь виджета. */
  .mwrap { border: 1px solid var(--rule); margin: 3px 0 1px; }
  .mchart { display: block; width: 100%; height: 64px; }
  .mstat { display: flex; gap: 6px; align-items: baseline;
    border-top: 1px solid var(--rule); padding: 1px 3px;
    font-size: 10px; color: var(--faint); line-height: 1.4; }
  .mstat .s { font-weight: 600; color: var(--ink); }
  .mstat .s.up { color: var(--up); } .mstat .s.down { color: var(--down); }
  .mstat .s.nil { color: var(--faint); font-weight: 400; }
  /* Фильтр, который держит вход, — не ошибка и не норма: отдельный цвет. */
  .mstat .blk { color: #a4681c; border-bottom: 1px dotted currentColor; }
  /* Плотность: 30 баров — получас крупно, 200 — три с половиной часа штрихами. */
  .dens { display: inline-flex; gap: 4px; text-transform: none; letter-spacing: 0; }
  .dens b { font-weight: 400; color: var(--faint); cursor: pointer; font-size: 10px; }
  .dens b:hover { color: var(--ink); }
  .dens b.on { color: var(--ink); border-bottom: 1px solid var(--ink); }
  .mchart .cndl.up, .mchart .wick.up { fill: var(--up); stroke: var(--up); }
  .mchart .cndl.down, .mchart .wick.down { fill: var(--down); stroke: var(--down); }
  .mchart .wick { stroke-width: 1; }
  .mchart .cndl { stroke: none; }
  /* Заявка — пунктир, средняя — сплошная: висящее и уже случившееся не должны
     читаться одинаково. */
  .mchart .ord { stroke-width: 1; stroke-dasharray: 3 3; opacity: .85; }
  .mchart .ord.up { stroke: var(--up); }
  .mchart .ord.down { stroke: var(--down); }
  .mchart .avg { stroke: var(--muted); stroke-width: 1; opacity: .7; }
  .mchart .olbl { font: 400 8px/1 Consolas, monospace; }
  .mchart .olbl.up { fill: var(--up); }
  .mchart .olbl.down { fill: var(--down); }
  .mchart .fill.up { fill: var(--up); }
  .mchart .fill.down { fill: var(--down); }
  /* Подложка чипа цены — переменной: мобильная панель тёмная, и зашитая
     «тёплая бумага» была бы там светлой кляксой поверх свечей. */
  .mchart .chip { fill: var(--chip-bg); stroke: var(--rule); stroke-width: .5; }
  .mchart .chiptx { font: 400 8px/1 Consolas, monospace; fill: var(--ink); text-anchor: end; }
  .chart-empty { color: var(--faint); font-size: 10px; padding: 3px 0 2px; }
  /* % к вчерашнему закрытию — рядом с итоговой суммой, мельче её. */
  .chg { font-size: 10px; font-weight: 600; margin-left: 5px; color: var(--faint); }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }

  /* Вотчер: точка статуса + текст проблемы. */
  .chk { display: flex; align-items: baseline; gap: 5px; padding: 1px 0 1px 6px;
         border-left: 2px solid var(--up); }
  .chk.bad { border-left-color: var(--down); }
  .chk .n { color: var(--muted); min-width: 92px; }
  .chk .s { color: var(--up); }
  .chk.bad .s { color: var(--down); }
  /* Уведомления: свежие сверху; тревога красная, норма («восстановилось») зелёная. */
  .alert { padding: 1px 0 1px 6px; border-left: 2px solid var(--down); color: var(--down); }
  .alert.ok { border-left-color: var(--up); color: var(--up); }
  .alert .at { color: var(--faint); font-size: 9px; margin-right: 4px; }
  /* Уведомления схлопнуты: видно последнее, остальные — по стрелке. */
  .more { cursor: pointer; color: var(--muted); border-bottom: 1px dotted var(--rule);
    text-transform: none; letter-spacing: 0; margin-left: 6px; }
  .more:hover { color: var(--ink); }
  /* Лампа перебора: пульсирует, пока есть свежий отличный кандидат. */
  .star { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #b58900; margin-right: 4px; animation: starpulse 2s infinite; }
  @keyframes starpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .empty { color: var(--faint); padding-left: 8px; }
  /* Кассета вместо слова-дубля. Первый тег говорит, ЧЕМ робот рискует (реал или
     бумага), второй раньше повторял то же слово: «РЕАЛ РЕАЛ». Смысл второго —
     крутится или стоит, и это лучше показывать движением: катушки видно боковым
     зрением, слово надо прочитать. Рисунок по фотографии AGFA Fe I: чёрный корпус,
     светлая этикетка с двумя полосами, окно ленты, пять отверстий снизу. */
  .cass { display: inline-flex; align-items: center; vertical-align: -3px; }
  .cass svg { width: 29px; height: 19px; }
  .cass .shell { fill: #17181a; stroke: #454a52; stroke-width: .7; }
  .cass .label { fill: #e6e2d6; }
  .cass .stripe { fill: #c0392b; }
  .cass .stripe2 { fill: #2a6ebb; }
  .cass .win { fill: #0a0b0c; stroke: #3a3f47; stroke-width: .5; }
  .cass .tape { fill: #3a2a1c; }
  .cass .hole { fill: #0a0b0c; }
  .cass .hub { transform-box: fill-box; transform-origin: center;
    animation: cassreel 1.25s linear infinite; }
  .cass .hub circle { fill: #d8d4c8; }
  .cass .hub path { stroke: #17181a; stroke-width: 1.1; stroke-linecap: round; }
  /* Стоп: катушки замерли, кассета глушится — пауза видна, но не кричит. */
  .cass.stopped { opacity: .45; filter: grayscale(1); }
  .cass.stopped .hub { animation: none; }
  @keyframes cassreel { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .cass .hub { animation: none; } }
</style>
</head>
<body>
<div class="top">
  <a class="brand" id="brand" href="https://stl.shectory.ru/" data-ext
     title="Открыть STL в браузере">STL</a>
  <span class="fresh" id="fresh">…</span>
  <span class="btn" id="reload" title="Перечитать панель с сервера (после обновления вёрстки)">⟳</span>
  <span class="btn" id="hide" title="Свернуть в трей">✕</span>
  <span class="btn quit" id="quit" title="Закрыть приложение">⏻</span>
</div>
<div id="body"></div>

<script>
  // Кассета: катушки крутятся, пока робот работает, и замирают на паузе. Заменяет
  // второе слово «РЕАЛ», дублировавшее тег режима слева от него.
  const cassette = (playing) => `<span class="cass ${playing ? '' : 'stopped'}" title="${
      playing ? 'робот работает: считает бары и выставляет заявки'
              : 'на паузе: новые заявки не выставляются, позиция остаётся'}"><svg viewBox="0 0 30 20" aria-hidden="true"><rect class="shell" x=".5" y=".5" width="29" height="19" rx="1.8"/><rect class="label" x="2.6" y="2.2" width="24.8" height="7.2" rx=".7"/><rect class="stripe" x="2.6" y="2.2" width="24.8" height="1.1"/><rect class="stripe2" x="2.6" y="8.3" width="24.8" height="1.1"/><rect class="win" x="4.6" y="10.6" width="20.8" height="6.2" rx=".7"/><circle class="tape" cx="10.4" cy="13.7" r="2.9"/><circle class="tape" cx="19.6" cy="13.7" r="2.9"/><g class="hub"><circle cx="10.4" cy="13.7" r="1.5"/><path d="M10.4 12.2v3M8.9 13.7h3M9.3 12.6l2.2 2.2M11.5 12.6l-2.2 2.2"/></g><g class="hub"><circle cx="19.6" cy="13.7" r="1.5"/><path d="M19.6 12.2v3M18.1 13.7h3M18.5 12.6l2.2 2.2M20.7 12.6l-2.2 2.2"/></g><rect class="hole" x="7" y="18" width="1.5" height="1.2" rx=".3"/><rect class="hole" x="11.5" y="18" width="1.5" height="1.2" rx=".3"/><rect class="hole" x="16" y="18" width="1.5" height="1.2" rx=".3"/><rect class="hole" x="20.5" y="18" width="1.5" height="1.2" rx=".3"/></svg></span>`;

'use strict';
const STL = 'https://stl.shectory.ru';
// Страница живёт в двух местах. Внутри компаньона её отдаёт локальный прокси
// (127.0.0.1), он же подставляет токен и умеет /hide, /quit, /height, /open.
// Открытая в браузере из STL, она ходит прямо в API по сессии оператора —
// так вёрстку можно править и смотреть без пересборки exe.
const LOCAL = location.hostname === '127.0.0.1';
const API = LOCAL ? '' : '/api/v1/quik/companion';
const shell = (path) => LOCAL ? fetch(path).catch(() => {}) : Promise.resolve();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Деньги: узкий пробел между тысячами, знак всегда, "—" когда данных нет.
function rub(v, opts) {
  if (v == null || !isFinite(v)) return null;
  const o = opts || {};
  const n = Math.round(v);
  const sign = o.signed && n > 0 ? '+' : (n < 0 ? '-' : '');
  const body = Math.abs(n).toLocaleString('ru-RU').replace(/ /g, ' ');
  return sign + body + ' ₽';
}
function cls(v) { return v == null ? '' : (v > 0 ? 'up' : (v < 0 ? 'down' : '')); }
function val(txt, k) { return txt == null ? '<span class="v nil">—</span>'
  : `<span class="v ${k || ''}">${esc(txt)}</span>`; }
function hhmmss(ms) {
  if (!ms) return null;
  return new Date(ms).toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow' });
}
// Последняя сделка: ЧЧ:ММ (без секунд); если НЕ сегодня — с датой ДД.ММ (МСК).
function lastTradeFmt(ms) {
  if (!ms) return null;
  const opt = { timeZone: 'Europe/Moscow' };
  const dd = new Date(ms).toLocaleDateString('ru-RU', { ...opt, day: '2-digit', month: '2-digit' });
  const nd = new Date().toLocaleDateString('ru-RU', { ...opt, day: '2-digit', month: '2-digit' });
  const hm = new Date(ms).toLocaleTimeString('ru-RU', { ...opt, hour: '2-digit', minute: '2-digit' });
  return dd === nd ? hm : (dd + ' ' + hm);
}

// Заголовок: STL, дата, день недели, время (МСК), режим работы биржи.
function renderBrand(d, withMode) {
  const now = new Date(d && d.ts_ms ? d.ts_ms : Date.now());
  const p = new Intl.DateTimeFormat('ru-RU', {
    timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', year: 'numeric',
    weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).formatToParts(now).reduce((a, x) => (a[x.type] = x.value, a), {});
  // Режим биржи в шапку НЕ пишем: он и так есть строкой ниже, с цветом. В текст
  // для буфера (withMode=true) добавляем — там контекст важнее краткости.
  const mode = marketMode(d && d.market);
  const head = `STL · ${p.day}.${p.month}.${p.year} ${p.weekday} ${p.hour}:${p.minute}:${p.second}`;
  return withMode ? `${head} · ${mode}` : head;
}

// Строка "подпись ... значение" с рельсом по знаку.
function row(label, value, signValue, sub) {
  const k = cls(signValue);
  return `<div class="row ${k}"><span class="k">${esc(label)}</span>` +
    `<span class="sp"></span>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}` +
    `${val(value, k)}</div>`;
}

function renderAccount(a) {
  if (!a || !a.has_data) return '<div class="empty">счёт: агент ещё не прислал деньги</div>';
  // «Тек. чист. поз.» это колонка cbplused из QUIK. Её отдаёт только новая Lua
  // (v2026.07.24-posvm). Пока скрипт не перезагружён в терминале — данных нет,
  // и это честно подписываем, а не рисуем прочерк как будто сломалось.
  const used = a.used == null
    ? '<span class="v nil">нужна перезагрузка Lua</span>'
    : val(rub(a.used));
  return row('Лимит откр. поз.', rub(a.limit)) +
    `<div class="row"><span class="k">Тек. чист. поз.</span><span class="sp"></span>${used}</div>` +
    row('План. чист. поз.', rub(a.planned)) +
    row('Вариац. маржа', rub(a.varmargin, { signed: true }), a.varmargin) +
    row('Биржевые сборы', rub(a.ts_comission), a.ts_comission ? -1 : 0);
}

// Цена инструмента: НИКОГДА не округляем до целого (у BR шаг 0.01) — только
// гасим float-пыль. Правило поймано дважды, см. lib/format.ts.
function px(v) {
  return v == null || !isFinite(v) ? null
    : Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 6 });
}

function renderPositions(list) {
  if (!list || !list.length) return '<div class="empty">позиций нет</div>';
  const sg = (v) => v == null ? '—' : (v > 0 ? '+' : '') + v;
  return list.map((p) => {
    const vm = p.varmargin;
    // Живая котировка рядом с позицией: видно, по какой цене её мерить.
    const q = px(p.last);
    const stale = p.quote_age_ms != null && p.quote_age_ms > 120000;
    const quote = q == null ? '' :
      `<span class="q${stale ? ' q-stale' : ''}" title="последняя сделка${p.bid ? ' · bid ' + px(p.bid) : ''}${p.ask ? ' · ask ' + px(p.ask) : ''}${stale ? ' · котировка не обновлялась > 2 мин' : ''}">${q}</span>`;
    // Разбивка: Роботы (сумма позиций роботов) + Ручные (остаток мимо STL). Сумма = ВМ инстр.
    const rn = p.robot_net, mn = p.manual_net;
    const breakdown = (rn != null || mn != null)
      ? `<span class="sub">Роботы <b>${sg(rn)}</b> · Ручные <b>${sg(mn)}</b></span>`
      : `<span class="sub">${sg(p.net)}</span>`;
    // ВМ здесь — ЧИСЛО QUIK: вариационная маржа ЗА СЕССИЮ (с последнего клиринга),
    // включая закрытые за сессию сделки; перенесённая позиция считается от
    // клиринговой цены, а не от входа. У робота ниже — ВМ ОТ ВХОДА. Это разные
    // величины, поэтому подписаны по-разному (иначе выглядит как расхождение).
    return `<div class="row ${cls(vm)}" title="Вариационная маржа QUIK за текущую сессию (с последнего клиринга)">` +
      `<span class="k">${esc(p.sec)}</span>` + quote + breakdown +
      `<span class="sp"></span><span class="sub">ВМ сессии</span>` +
      `${val(rub(vm, { signed: true }), cls(vm))}</div>`;
  }).join('');
}

// Итог по ВСЕМ реальным роботам: только реальные деньги. Один осмысленный итог,
// а не смесь реала с бумагой.
function robotsTotal(list) {
  if (!list || !list.length) return '';
  // ПРАВИЛО: итог = фикс + ВМ открытых позиций. Раньше суммировался голый фикс,
  // и итог не видел живого минуса по открытой позиции.
  let fix = 0, vm = 0, today = 0, hasN = false, hasT = false;
  for (const r of list) {
    if (r.real_net != null) { fix += r.real_net; hasN = true; }
    if (r.varmargin != null) vm += r.varmargin;
    if (r.real_today != null) { today += r.real_today; hasT = true; }
  }
  const total = fix + vm;
  const split = vm ? `фикс ${rub(fix, { signed: true })} · ВМ ${rub(vm, { signed: true })}`
                   : `сегодня ${hasT ? rub(today, { signed: true }) : '—'}`;
  return `<div class="row total ${cls(hasN ? total : null)}">` +
    `<span class="k">Итог реал (${list.length})</span><span class="sp"></span>` +
    `<span class="sub">${split}</span>` +
    `${val(hasN ? rub(total, { signed: true }) : null, cls(total))}</div>`;
}

// Только РЕАЛЬНЫЕ ДЕНЬГИ. Число робота = весь его реальный итог из журнала,
// включая тех, кого потом перевели в бумагу (их реальный убыток не теряется).
// Выведенные из реала (в бумагу/сняты) схлопнуты в ОДНУ строку суммой — их
// детали больше не операционные, но реальный результат из виду не пропадает.
function renderRobots(all) {
  if (!all || !all.length) return '<div class="empty">реальных роботов нет</div>';
  const active = all.filter((r) => r.state === 'реал' || r.state === 'пауза');
  const retired = all.filter((r) => r.state !== 'реал' && r.state !== 'пауза');
  let out = renderActiveRobots(active);
  if (retired.length) {
    let net = 0, hasN = false;
    for (const r of retired) if (r.real_net != null) { net += r.real_net; hasN = true; }
    out += `<div class="row ${cls(hasN ? net : null)}">` +
      `<span class="k">Выведены из реала (${retired.length})</span>` +
      `<span class="sub">итог их реальной торговли</span><span class="sp"></span>` +
      `${val(hasN ? rub(net, { signed: true }) : null, cls(net))}</div>`;
  }
  return out;
}

// ── Мини-график робота ───────────────────────────────────────────────────────
// Полчаса минуток, его висящие заявки и его сделки. Свечи строит РАННЕР из ленты
// всех сделок: это ровно те бары, по которым робот принимал решение, поэтому его
// сделки лежат на своей свече. Бары ISS сюда подмешивать нельзя — там московское
// время штамповано как UTC, и филлы уехали бы на три часа.
// Плотность выбирает оператор: 30 баров это получас крупными свечами, 200 —
// три с половиной часа, где свеча вырождается в штрих шириной в пиксель. Обе
// картинки нужны: по первой видно вход, по второй — куда идёт день.
const DENSITY = [30, 60, 120, 200];
const CH = { w: 320, h: 64, body: 7, pad: 3 };
function density() {
  const v = +(localStorage.getItem('stl.chartN') || 30);
  return DENSITY.includes(v) ? v : 30;
}
function setDensity(n) {
  localStorage.setItem('stl.chartN', String(n));
  tick();   // за плотностью идём на сервер: хвост режет он, не клиент
}

// Раскрытые графики живут ВНЕ DOM: paint() перерисовывает панель целиком каждые
// 5 секунд, и состояние, хранимое в разметке, схлопывалось бы само собой.
const chartOpen = new Map(JSON.parse(localStorage.getItem('stl.chartOpen') || '[]'));
function chartShown(r) {
  const v = chartOpen.get(r.id);
  if (v !== undefined) return v;            // оператор решил явно — его слово
  const ch = r.chart;                       // иначе: открыт у того, кому есть что показать
  return !!ch && (!!r.position || (ch.orders && ch.orders.length > 0));
}
function toggleChart(id) {
  const r = (lastData && lastData.robots || []).find((x) => x.id === id);
  if (!r) return;
  chartOpen.set(id, !chartShown(r));
  localStorage.setItem('stl.chartOpen', JSON.stringify([...chartOpen]));
  if (lastData) paint(lastData);
}

// Округление КООРДИНАТЫ до десятой пикселя (не цены — цену форматирует px()).
const r1 = (v) => Math.round(v * 10) / 10;

function miniChart(ch) {
  if (!ch || !ch.bars || !ch.bars.length) {
    return '<div class="chart-empty">баров нет: раннер ещё не собрал ленту</div>';
  }
  const bars = ch.bars.slice(-density());
  let hi = -Infinity, lo = Infinity;
  for (const b of bars) { if (b.h > hi) hi = b.h; if (b.l < lo) lo = b.l; }
  if (!(hi > lo)) { hi += 1; lo -= 1; }     // плоская минута: иначе делим на ноль
  const inner = CH.h - 2 * CH.pad;
  const y = (p) => r1(CH.pad + (hi - p) / (hi - lo) * inner);
  const yc = (p) => Math.min(CH.h - 0.5, Math.max(0.5, y(p)));   // прижатый к краю
  // Шаг и тело считаем от ФАКТИЧЕСКОГО числа баров, а не от выбранной плотности:
  // после перезапуска раннера их бывает меньше, и делить ширину на 200, показывая
  // 40, значит рисовать четверть графика. На плотных сетках тело схлопывается в
  // штрих: 200 баров на 320 px это 1.6 px на бар, зазору взяться неоткуда.
  const pitch = CH.w / Math.max(bars.length, 1);
  const body = Math.max(1, Math.min(CH.body, pitch - 3));
  // Свечи прижаты ВПРАВО: свежая минута всегда у правого края.
  const xOf = (i) => CH.w - (bars.length - i) * pitch + pitch / 2;
  let s = '';
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i], cx = xOf(i);
    const k = b.c >= b.o ? 'up' : 'down';
    const yo = y(b.o), ycl = y(b.c);
    const top = Math.min(yo, ycl), hgt = Math.max(0.8, Math.abs(ycl - yo));
    s += `<line class="wick ${k}" x1="${r1(cx)}" y1="${y(b.h)}" x2="${r1(cx)}" y2="${y(b.l)}"/>`
      + `<rect class="cndl ${k}" x="${r1(cx - body / 2)}" y="${r1(top)}"`
      + ` width="${r1(body)}" height="${r1(hgt)}"/>`;
  }
  // Средняя цена позиции — сплошная тонкая линия.
  if (ch.avg) s += `<line class="avg" x1="0" y1="${yc(ch.avg)}" x2="${CH.w}" y2="${yc(ch.avg)}"/>`;
  // Висящие заявки. Заявка ВНЕ диапазона свечей прижимается к краю со стрелкой:
  // растягивать шкалу под заявку, ждущую пробоя за 3000 пунктов, нельзя —
  // свечи схлопнутся в нитку, а они здесь главные.
  for (const o of (ch.orders || [])) {
    const k = o.side === 'buy' ? 'up' : 'down';
    const oy = yc(o.price), off = y(o.price) !== oy;
    s += `<line class="ord ${k}" x1="0" y1="${oy}" x2="${CH.w}" y2="${oy}"/>`
      + `<text class="olbl ${k}" x="2" y="${r1(Math.min(CH.h - 2, Math.max(8, oy - 1.5)))}">`
      + `${o.side === 'buy' ? 'B' : 'S'}${o.qty ? ' ' + o.qty : ''}`
      + `${off ? ' ' + (oy <= 1 ? '▲' : '▼') + ' ' + esc(px(o.price)) : ''}</text>`;
  }
  // Сделки: треугольник на своей минуте. Покупка вверх, продажа вниз.
  const t0 = bars[0].t;
  for (const f of (ch.fills || [])) {
    const i = Math.round((f.ts / 1000 - t0) / 60);
    if (i < 0 || i >= bars.length) continue;
    const cx = xOf(i), fy = yc(f.price), up = f.side === 'buy';
    const d = up ? `${r1(cx)},${r1(fy - 4)} ${r1(cx - 3.2)},${r1(fy + 1.6)} ${r1(cx + 3.2)},${r1(fy + 1.6)}`
                 : `${r1(cx)},${r1(fy + 4)} ${r1(cx - 3.2)},${r1(fy - 1.6)} ${r1(cx + 3.2)},${r1(fy - 1.6)}`;
    s += `<polygon class="fill ${up ? 'up' : 'down'}" points="${d}"><title>`
      + `${up ? 'покупка' : 'продажа'} ${f.qty} по ${esc(px(f.price))}</title></polygon>`;
  }
  // Последняя цена — чипом у правого края, поверх свечей: отдельный жёлоб съел бы
  // ширину, которой не хватает даже на пять цифр.
  const lastB = bars[bars.length - 1], ly = yc(lastB.c);
  s += `<rect class="chip" x="${CH.w - 34}" y="${r1(Math.min(CH.h - 11, Math.max(0, ly - 5.5)))}"`
    + ` width="33" height="11" rx="1.5"/>`
    + `<text class="chiptx" x="${CH.w - 2}" y="${r1(Math.min(CH.h - 2.5, Math.max(8.5, ly + 3)))}">`
    + `${esc(px(lastB.c))}</text>`;
  // Статус ОТДЕЛЬНОЙ строкой под холстом, а не подписью внутри: свечи налезали
  // на текст и он терялся ровно тогда, когда был нужнее всего.
  return `<div class="mwrap">`
    + `<svg class="mchart" viewBox="0 0 ${CH.w} ${CH.h}" width="${CH.w}" height="${CH.h}"`
    + ` preserveAspectRatio="none" aria-hidden="true">${s}</svg>`
    + chartStatus(ch) + `</div>`;
}

// Нижняя статусная строка: что робот думает и что ему мешает. Сигнал слева,
// справа — фильтр, который ПРЯМО СЕЙЧАС не пускает вход (долина смерти,
// разножка, остывание). Полная фраза раннера уходит в подсказку: в ширину
// панели она не влезает, а терять её нельзя.
function chartStatus(ch) {
  const sig = !ch.signal_known
    ? ['сигнал не рассчитан', 'nil']
    : ch.want === 1 ? ['лонг', 'up']
    : ch.want === -1 ? ['шорт', 'down']
    : ch.want === 0 ? ['выйти в кэш', '']
    : ['сигнала нет', 'nil'];
  let out = `<span class="s ${sig[1]}">${esc(sig[0])}</span>`;
  if (ch.blocked_tag) {
    out += `<span class="blk" title="${esc(ch.blocked)}">${esc(ch.blocked_tag)}</span>`;
  }
  return `<div class="mstat">${out}</div>`;
}

function renderActiveRobots(list) {
  if (!list.length) return '';
  return list.map((r) => {
    // ПРАВИЛО: в заголовке фин.рез = фикс + ВМ открытой позиции; разбивка строкой ниже.
    const net = r.real_total != null ? r.real_total : r.real_net;
    const k = cls(net);
    const last = lastTradeFmt(r.last_trade_ms);
    const st = r.state;                    // 'реал' | 'пауза' | 'переведён в бумагу' | 'снят'
    const stCls = st === 'пауза' ? 'paused' : (st === 'реал' ? 'real' : 'off');
    // Режим ОТДЕЛЬНЫМ тегом: «пауза» сама по себе не говорила, реал это или бумага,
    // и оператор не понимал, чем робот сейчас рискует (30.07.2026).
    const modeTag = r.mode
      ? `<span class="tag mode ${r.mode}" title="${r.mode === 'real'
          ? 'реальные деньги: заявки уходят в QUIK на реальный счёт'
          : 'бумага: сделки только в памяти раннера'}">${r.mode === 'real' ? 'реал' : 'бумага'}</span>`
      : '';
    // «Только на выход» — не состояние, а режим поверх реала: робот закрывает свою
    // позицию по своему сигналу и новых не открывает. Отдельным тегом, чтобы
    // деление на активных/выведенных (по state) осталось нетронутым.
    const exitTag = r.exit_only
      ? '<span class="tag exitonly" title="робот закрывает позицию по своему сигналу и новых не открывает">только на выход</span>'
      : '';
    const ann = r.ann_pct == null ? null
      : (r.ann_pct > 0 ? '+' : '') + r.ann_pct.toFixed(1) + '%';
    // Горизонт рядом с годовой: на 7 днях истории ×52 даёт ±1800%, и без
    // подписи это читается как баг, а не как экстраполяция.
    const annDays = r.started_ms ? Math.max(1, Math.round((Date.now() - r.started_ms) / 86400000)) : null;
    // СЕГОДНЯ показываем ВСЕГДА, даже когда робот в позиции: иначе за день не
    // видно, что он наработал. Это фикс ЗА СЕГОДНЯ + изменение ВМ ЗА СЕГОДНЯ
    // (не вся ВМ позиции: перенесённая со вчера уже частью отработана вчера).
    const tSum = r.today_total;
    // Вторая составляющая — НЕ «ВМ за сегодня», а ПЕРЕОЦЕНКА: изменение
    // нереализованной прибыли. Когда робот закрывает старую позицию, весь
    // накопленный со вчера минус падает в фикс, и ВМ за сегодня его возвращает
    // его обратно — иначе вчерашний убыток посчитался бы сегодня второй раз.
    // Подписывать это словом «ВМ» нельзя: +15 128 читается как заработок дня,
    // хотя робот за день потерял (живой случай agent-ob-BRU6-v1, 28.07).
    // Вторую составляющую дня НЕЛЬЗЯ звать просто «ВМ»: у робота БЕЗ позиции это
    // читается как бред («откуда ВМ, если позиции час нет?»). А величина честная —
    // это изменение НЕреализованной части за день: у робота с позицией её переоценка,
    // у закрывшегося — снятие вчерашнего переноса (вчерашний минус не реализовался).
    const flat = !r.position;
    const vmLabel = flat ? 'снятие вчерашней ВМ' : 'ВМ откр. поз.';
    const vmHint = flat
      ? 'Робот сейчас без позиции. Это ВМ, перенесённая со вчера: вчера он ушёл в ночь с открытой позицией, её нереализованный результат сегодня снялся (закрыл сделку или рынок ушёл). Без этой части день был бы посчитан неверно: вчерашний бумажный минус попал бы в сегодняшний фикс второй раз.'
      : 'Изменение нереализованного результата открытой позиции ЗА СЕГОДНЯ (не вся её ВМ от входа, а только сегодняшняя часть).';
    const today = r.vm_today == null
      ? `<span title="Результат ЗА СЕГОДНЯ = закрытые сделки за сегодня + изменение нереализованной части за сегодня.&#10;Вторая часть сейчас неизвестна (нет вчерашней цены закрытия), поэтому полный результат дня не показываем — только закрытые сделки.">сегодня <b class="${cls(r.real_today)}">${r.real_today == null ? '—' : rub(r.real_today, { signed: true })}</b>`
        + `<span style="opacity:.75"> фикс · ${vmLabel} н/д</span></span>`
      : `<span title="Результат ЗА СЕГОДНЯ = закрытые сделки за сегодня + изменение нереализованной части за сегодня.&#10;${vmHint}">сегодня <b class="${cls(tSum)}">${rub(tSum, { signed: true })}</b>`
        + `<span style="opacity:.75"> = фикс ${rub(r.real_today, { signed: true })}`
        + ` · ${vmLabel} ${rub(r.vm_today, { signed: true })}</span></span>`;
    // Рядом с общим итогом — насколько он сдвинулся против вчерашнего закрытия.
    const chg = r.chg_pct == null ? ''
      : `<span class="chg ${cls(r.chg_pct)}" title="изменение общего фин.результата по сравнению с концом вчерашнего дня">${r.chg_pct > 0 ? '+' : ''}${r.chg_pct.toFixed(1)}%</span>`;
    const open = chartShown(r);
    // Стрелка есть только там, где график вообще можно показать: у робота без
    // баров она обещала бы то, чего нет.
    const chevron = r.chart
      ? `<span class="chev" title="${open ? 'свернуть график' : 'показать график: полчаса минуток, заявки и сделки робота'}">${open ? '▴' : '▾'}</span>`
      : '';
    return `<div class="rob ${k}" data-rid="${esc(r.id)}">
      <div class="hd">
        <a href="${STL}/?agent_robot=${encodeURIComponent(r.id)}" data-ext>${esc(r.name)}</a>
        ${chevron}
        ${modeTag}
        ${st === 'реал' || st === 'пауза'
          ? cassette(st === 'реал')
          : `<span class="tag ${stCls}">${esc(st)}</span>`}
        ${exitTag}
        <span class="sp" style="flex:1"></span>
        ${val(rub(net, { signed: true }), k)}
        ${chg}
      </div>
      <div class="nums">
        <span title="фикс по закрытым сделкам за всё время + ВМ открытой позиции (от входа)">итого фикс <b class="${cls(r.real_net)}">${rub(r.real_net, { signed: true })}</b>${r.varmargin ? ` · ВМ <b class="${cls(r.varmargin)}">${rub(r.varmargin, { signed: true })}</b>` : ''}</span>
        ${today}
        ${r.position == null ? '' : `<span title="текущая позиция из максимально допустимой (потолок робота на агенте)">поз <b class="${cls(r.position)}">${r.position}</b>${r.max_position ? ` из <b>${r.max_position}</b>` : ''}</span>`}
        ${ann == null ? '' : `<span title="доходность в год: (фикс+ВМ) к максимальному задействованному ГО${r.max_go ? ' ' + Math.round(r.max_go).toLocaleString('ru-RU') + ' ₽' : ''}, линейно экстраполировано с ${annDays} дн">год <b class="${cls(r.ann_pct)}">${ann}</b>${annDays ? ` <span style="opacity:.7">за ${annDays} дн</span>` : ''}</span>`}
        <span>сделок сегодня <b>${r.real_trades_today || 0}</b></span>
        <span>${last ? 'посл. ' + last : 'реальных сделок нет'}</span>
      </div>
      ${open && r.chart ? miniChart(r.chart) : ''}
    </div>`;
  }).join('');
}

// #6: ручные заявки — простые (таблица заявок QUIK, без тега = ручной класс)
// и умные (книга STL). Только статус, действия — в терминале STL.
// Полночь по Москве: таблица сделок QUIK держит только текущую сессию, поэтому
// вчерашним заявкам цену уже не найти — им честнее оставить уровень.
function todayLo(d) {
  const now = new Date(d && d.ts_ms ? d.ts_ms : Date.now());
  const msk = new Date(now.getTime() + (now.getTimezoneOffset() + 180) * 60000);
  msk.setHours(0, 0, 0, 0);
  return msk.getTime() - (now.getTimezoneOffset() + 180) * 60000;
}

function renderOrders(o, d) {
  if (!o || (!(o.manual || []).length && !(o.smart || []).length))
    return '<div class="empty">ручных заявок нет</div>';
  const sideRu = (s) => s === 'buy' ? 'покупка' : 'продажа';
  const num = (v) => v == null ? '—' : Number(v).toLocaleString('ru-RU');
  let out = '';
  for (const m of o.manual || []) {
    out += `<div class="row"><span class="k">${esc(m.sec)} ${sideRu(m.side)} ${m.qty}</span>` +
      `<span class="sub">@ ${num(m.price)}${m.active && m.balance < m.qty ? ` · осталось ${m.balance}` : ''}</span>` +
      `<span class="sp"></span><span class="v ${m.active ? 'up' : 'nil'}">${esc(m.state)}</span></div>`;
  }
  const KIND = { sl: 'SL', tp: 'TP', trail_tp: 'TRAIL', on_fill: 'по сделке' };
  const ST = { armed: 'взведена', fired: 'сработала', cancelled: 'снята',
    expired: 'истекла', orphaned: 'осиротела', error: 'ошибка' };
  for (const s of o.smart || []) {
    // У СРАБОТАВШЕЙ заявки показываем ЦЕНУ СДЕЛКИ, а не уровень срабатывания:
    // уровень уже история, а оператору нужен факт — по чём вошёл.
    let sub = s.trigger ? `уровень ${num(s.trigger)}` : '';
    if (s.fired_price) sub = `сделка по ${px(s.fired_price)}${s.fired_qty ? ' × ' + s.fired_qty : ''}`;
    else if ((s.status === 'fired' || s.status === 'orphaned') && s.fired_ms > todayLo(d))
      sub = 'цена сделки уточняется';   // сегодняшнюю подтянем из таблицы сделок QUIK
    if (s.sl_offset) sub += ` · стоп ${s.sl_offset} п.`;
    if (s.tp_offset) sub += ` · тейк ${s.tp_offset} п.`;
    if (s.kind === 'trail_tp' && s.status === 'armed') {
      sub = s.activated
        ? `● от пика ${num(s.peak)}, сделка при ${s.side === 'buy' ? '≥' : '≤'} ` +
          num(s.side === 'buy' ? s.peak + s.trail_offset : s.peak - s.trail_offset)
        : `ждёт пробоя ${num(s.trigger)}`;
    }
    const live = s.status === 'armed';
    out += `<div class="row"><span class="k">умная ${KIND[s.kind] || s.kind} · ${esc(s.code)} ${sideRu(s.side)} ${s.qty}</span>` +
      `<span class="sub">${esc(sub)}</span><span class="sp"></span>` +
      `<span class="v ${live ? (s.activated ? 'up' : '') : 'nil'}">${esc(ST[s.status] || s.status)}</span></div>`;
  }
  return out;
}

// Вотчер компактно, В ОДНУ СТРОКУ на проверку: имя + ОК/текст проблемы.
// Плюс лампа перебора: свежий отличный кандидат (прибыльный, RF>=3, сделок>=30
// за 24ч) — жёлтая пульсация со ссылкой на его кампанию в Ботсторе.
function renderWatch(w) {
  if (!w) return '<div class="empty">нет данных</div>';
  const bt = w.backtests || {};
  const pl = w.platform || {};
  const i9 = pl.i9;
  const oneLine = (name, blk, extra) => {
    const bad = blk && blk.ok === false;
    const txt = bad ? (blk.issues || []).join('; ') : 'ОК' + (extra ? ' · ' + extra : '');
    return `<div class="chk ${bad ? 'bad' : ''}"><span class="n">${esc(name)}</span>` +
      `<span class="s">${esc(txt)}</span></div>`;
  };
  const btExtra = `в работе ${bt.running || 0} · ждут ${bt.queued || 0}`;
  const platExtra = 'LA ' + (pl.hoster && pl.hoster.load != null ? pl.hoster.load : '—') +
    ' · i9 ' + (i9 ? (i9.stale ? 'молчит' : (i9.cpu_pct != null ? i9.cpu_pct + '%' : 'он')) : 'н/д');
  let star = '';
  if (bt.star) {
    const s = bt.star;
    star = `<div class="chk"><span class="n"><span class="star"></span>кандидат</span>` +
      `<span class="s"><a href="${STL}/?campaign=${encodeURIComponent(s.campaign)}" data-ext` +
      ` style="color:inherit">${esc(s.strategy)} · ${esc(s.symbol)}: +${Number(s.net).toLocaleString('ru-RU')} ₽,` +
      ` RF ${s.rf}, ${s.trades} сд. ↗</a></span></div>`;
  }
  return oneLine('раннер + lua', w.runner) +
    oneLine('бэктесты', bt, btExtra) +
    oneLine('платформа', pl, platExtra) +
    star;
}

// Уведомления схлопнуты до ПОСЛЕДНЕГО: панель не должна расти вниз лентой
// истории. Остальные раскрываются стрелкой рядом с «копировать».
let alertsOpen = false;
function renderAlerts(a) {
  if (!a) return '';
  // Свежие СВЕРХУ; ok=зелёная норма, иначе красная тревога. items уже
  // отсортированы бэкендом по ts_ms desc.
  const items = a.items || [];
  if (!items.length) return '<div class="empty">тихо, эскалаций нет</div>';
  const shown = alertsOpen ? items : items.slice(0, 1);
  return shown.map((it) =>
    `<div class="alert ${it.ok ? 'ok' : ''}">` +
    `<span class="at">${esc(hhmmss(it.ts_ms) || '')}</span>${esc(it.text)}</div>`).join('');
}
function alertsToggle(a) {
  const n = ((a && a.items) || []).length;
  if (n <= 1) return '';
  return `<span class="more" id="moreAlerts" title="${alertsOpen ? 'свернуть' : 'показать ещё ' + (n - 1)}">`
    + `${alertsOpen ? '▴' : '▾'} ${alertsOpen ? 'свернуть' : 'ещё ' + (n - 1)}</span>`;
}

// next_session — полный ISO-datetime (дата+время+смещение), не голая дата.
// Раньше формат резался как 'YYYY-MM-DD' (slice/split/reverse) и на реальном
// ISO-времени с 'T' и '+03:00' давал мусор ('03T07:00:00+03:00.08') — та самая
// обрезанная строка на панели.
function fmtNextSession(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const opt = { timeZone: 'Europe/Moscow' };
  const dd = d.toLocaleDateString('ru-RU', { ...opt, day: '2-digit', month: '2-digit' });
  const hm = d.toLocaleTimeString('ru-RU', { ...opt, hour: '2-digit', minute: '2-digit' });
  return dd + ' ' + hm;
}

// «Скоро» показываем ОДНИМ временем, дату добавляем только если это не сегодня:
// до открытия и до конца клиринга ждать минуты, и «08.08 10:00» в такой строке
// сообщает ровно на два лишних числа больше, чем нужно.
function fmtSoon(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const opt = { timeZone: 'Europe/Moscow' };
  const day = (x) => x.toLocaleDateString('ru-RU', { ...opt, day: '2-digit', month: '2-digit' });
  const hm = d.toLocaleTimeString('ru-RU', { ...opt, hour: '2-digit', minute: '2-digit' });
  return day(d) === day(new Date()) ? hm : day(d) + ' ' + hm;
}

// Режим биржи ОФИЦИАЛЬНО (ISS: TRADE_SESSION_DATE + последняя сделка):
// торги / клиринг-пауза / биржа закрыта / выходной / до открытия.
// ВРЕМЯ ОТКРЫТИЯ ПИШЕМ ВСЕГДА, когда оракул его знает. «до открытия» без часа
// заставляет оператора идти искать расписание — а next_session лежит в том же
// ответе. Особенно на выходных: сессия FORTS в субботу стартует в 10:00, а не
// в 07:00 как в будни, и угадать это по слову «до открытия» невозможно.
function marketMode(m) {
  if (!m) return 'биржа: н/д';
  const nxt = fmtNextSession(m.next_session);
  const soon = fmtSoon(m.next_session);
  switch (m.phase) {
    case 'trading': return 'торги идут';
    case 'break': return soon ? `клиринг/пауза до ${soon}` : 'клиринг/пауза';
    case 'pre_open': return soon ? `до открытия в ${soon}` : 'до открытия';
    case 'done': return nxt ? `Биржа закрыта. Открытие торгов ${nxt}` : 'Биржа закрыта';
    case 'holiday': return nxt ? `выходной (MOEX) · след. ${nxt}` : 'выходной (MOEX)';
    default: return m.open === true ? 'торги идут' : m.open === false ? 'биржа закрыта' : 'биржа: н/д';
  }
}

// Двухстрочная карточка: статус сверху (переносится, если длинный — «биржа
// закрыта. открытие торгов…»), «посл. сделка» мелкой строкой под ним. Раньше
// это была одна .row: метка + «посл. сделка» + статус боролись за 330px
// панели, сминались и обрезались.
function renderMarket(m) {
  if (!m) return '';
  const open = m.open;
  const kls = open === true ? 'up' : open === false ? '' : 'nil';
  // Часы берём у АГЕНТА (лента QUIK, реальное время), а не у ISS: ISS отдаёт
  // рынок с задержкой ~15 минут, и панель писала 14:21, когда в «Таблице всех
  // сделок» оператора шло 14:37. Для вопроса «открыт ли рынок» задержка
  // безвредна, но как ЧАСЫ это ложь. ISS остаётся запасным источником.
  const tapeMs = m.tape_last_ms || 0;
  const srcMs = tapeMs || m.last_trade_ms;
  const lt = srcMs ? new Date(srcMs).toLocaleString('ru-RU',
    { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', hour: '2-digit',
      minute: '2-digit', ...(tapeMs ? { second: '2-digit' } : {}) }) : '—';
  return `<div class="mkt ${kls === 'up' ? 'up' : ''}">` +
    `<div class="hd"><span class="k">Биржа MOEX</span><span class="sp"></span>` +
    `<span class="v ${kls}">${esc(marketMode(m))}</span></div>` +
    // ЧЬЯ это сделка. Раньше строка звалась просто «посл. сделка», ровно как в
    // карточке робота, где это сделка САМОГО робота. Здесь же — последняя сделка
    // НА БИРЖЕ по опорному инструменту оракула (им может быть чужой код, оракул
    // берёт тот, где сделка свежее). Это доказательство живой ленты, а не наша
    // торговля, и путать их нельзя.
    `<div class="sub" title="Последняя сделка НА БИРЖЕ по опорному инструменту оракула сессии — признак того, что лента жива. К вашим роботам отношения не имеет: их сделки показаны в карточках роботов.">`
    + `на бирже торговали ${esc(lt)}${m.source_code ? ' · ' + esc(m.source_code) : ''}</div></div>`;
}

let lastGood = 0;
let lastData = null;   // последний снапшот — для копирования уведомлений
function paint(d) {
  lastData = d;
  $('brand').textContent = renderBrand(d);
  $('body').innerHTML =
    '<div class="sec">биржа</div>' + renderMarket(d.market) +
    '<div class="sec">счёт</div>' + renderAccount(d.account) +
    '<div class="sec">позиции</div>' + renderPositions(d.positions) +
    `<div class="sec">роботы <a href="${STL}/?lab=live&equity=1" data-ext>витрина ↗</a>` +
      `<span class="dens" title="сколько минутных баров помещать в ширину графика">` +
      DENSITY.map((n) => `<b class="${n === density() ? 'on' : ''}" data-dens="${n}">${n}</b>`).join('') +
      `</span></div>` +
      robotsTotal(d.robots) + renderRobots(d.robots) +
    `<div class="sec">заявки ручные <a href="${STL}/?orders=1" data-ext>терминал ↗</a></div>` +
      renderOrders(d.orders, d) +
    `<div class="sec">вотчер <a href="${STL}/?lab=botstore" data-ext>хитпарад ↗</a></div>` +
      renderWatch(d.watch) +
    `<div class="sec">уведомления <a href="${STL}/watchdog-log.html" data-ext>детали ↗</a>` +
      `<span class="sp" style="flex:1"></span><span class="copy" id="copyAlerts">копировать</span>` +
      alertsToggle(d.alerts) + `</div>` +
      renderAlerts(d.alerts);
  fitWindow();
}

// Текст для буфера: то, что оператор перешлёт в чат. Собираем контекст —
// свежесть, паузы роботов, проблемы вотчера и эскалации — не только сырые SMS.
function alertsText() {
  const d = lastData || {};
  const L = [renderBrand(d, true)];
  const paused = (d.robots || []).filter((r) => r.state === 'пауза').map((r) => r.name);
  if (paused.length) L.push('на паузе (реал): ' + paused.join(', '));
  const exitOnly = (d.robots || []).filter((r) => r.exit_only).map((r) => r.name);
  if (exitOnly.length) L.push('только на выход: ' + exitOnly.join(', '));
  const w = d.watch || {};
  for (const [name, blk] of [['раннер+lua', w.runner], ['бэктесты', w.backtests], ['платформа', w.platform]]) {
    if (blk && blk.ok === false && (blk.issues || []).length) L.push(name + ': ' + blk.issues.join('; '));
  }
  const a = d.alerts || {};
  (a.unresolved || []).forEach((t) => L.push('не решено: ' + t));
  (a.sms_today || []).forEach((t) => L.push('SMS: ' + t));
  if (L.length === 1) L.push('всё в норме, эскалаций нет');
  return L.join('\n');
}

async function copyAlerts(btn) {
  const text = alertsText();
  let ok = false;
  if (LOCAL) {
    // Через прокси компаньона — буфер Windows ставит Go, без ограничений WebView2.
    try { const r = await fetch('/clip', { method: 'POST', body: text }); ok = r.ok; } catch { /**/ }
  } else {
    try { await navigator.clipboard.writeText(text); ok = true; } catch { /**/ }
  }
  if (btn) { btn.textContent = ok ? 'скопировано' : 'не вышло'; btn.classList.toggle('done', ok); }
  setTimeout(() => { if (btn) { btn.textContent = 'копировать'; btn.classList.remove('done'); } }, 1600);
}

// Внешние ссылки открывает системный браузер: внутри WebView2 новое окно
// либо не откроется, либо утащит панель на чужую страницу.
document.addEventListener('click', (e) => {
  // Клик, которым закончилось перетаскивание, — не клик. Окно по ВРЕМЕНИ, а не
  // флагом: флаг, за которым клик так и не пришёл, съел бы следующий настоящий.
  if (Date.now() - dragEndedAt < 300) { e.preventDefault(); return; }
  const copyBtn = e.target.closest('.copy');
  if (copyBtn) { copyAlerts(copyBtn); return; }
  if (e.target.closest('.more')) { alertsOpen = !alertsOpen; if (lastData) paint(lastData); return; }
  const dens = e.target.closest('[data-dens]');
  if (dens) { setDensity(+dens.dataset.dens); return; }
  // Клик по карточке робота раскрывает его график. Ссылка на витрину внутри
  // карточки обрабатывается ниже и сюда не попадает.
  const rob = e.target.closest('.rob[data-rid]');
  if (rob && !e.target.closest('a')) { toggleChart(rob.dataset.rid); return; }
  const a = e.target.closest('a[data-ext]');
  if (!a || !LOCAL) return;   // в браузере ссылка работает сама собой
  e.preventDefault();
  shell('/open?url=' + encodeURIComponent(a.href));
});
$('hide').onclick = () => shell('/hide');
$('quit').onclick = () => shell('/quit');
// Вёрстка приезжает из STL и берётся прокси только при навигации, поэтому раньше
// каждая правка панели требовала перезапуска exe. Метка времени в адресе — чтобы
// WebView2 не отдал страницу из своего кэша по тому же URL.
$('reload').onclick = () => { location.href = '/?r=' + Date.now(); };
if (!LOCAL) {
  $('hide').style.display = $('quit').style.display = $('reload').style.display = 'none';
}

// ── Перетаскивание панели за шапку ───────────────────────────────────────────
// У окна нет ни рамки, ни заголовка, а мышь принадлежит окну WebView2 — системный
// drag за заголовок недоступен в принципе. Поэтому позицию двигает Go, а страница
// шлёт ему смещения мыши: /move?dx=&dy=, на отпускании /move?save=1.
// screenX страница считает в CSS-пикселях, окно живёт в физических — отсюда
// множитель devicePixelRatio, без него при масштабе 125% панель уезжала бы
// быстрее курсора.
// Тащить можно за ЛЮБОЕ свободное место панели, а не за какую-то одну полосу:
// содержимое здесь меняется от снапшота к снапшоту, и ручка, привязанная к
// конкретной строке, однажды просто исчезнет вместе с ней.
//
// Перетаскивание начинается только ПОСЛЕ порога в 3 пикселя. До него не
// вызывается ни preventDefault, ни setPointerCapture, поэтому обычный клик по
// ссылке или кнопке остаётся ровно тем, чем был, и разбирать его руками не надо.
const DRAG_SLOP = 3;
let dragEndedAt = 0;   // чтобы клик, завершающий перетаскивание, никуда не ушёл
(function enableDrag() {
  if (!LOCAL) return;
  document.body.classList.add('draggable');
  let st = null, pend = null, frame = 0;
  function flush() {
    frame = 0;
    if (!pend) return;
    // Целые пиксели уезжают, дробный остаток копится — иначе медленное
    // перетаскивание округлялось бы в ноль и панель стояла бы на месте.
    const dx = Math.round(pend.x), dy = Math.round(pend.y);
    pend.x -= dx; pend.y -= dy;
    if (dx || dy) shell('/move?dx=' + dx + '&dy=' + dy);
  }
  document.addEventListener('pointerdown', (e) => {
    // Кнопки, ссылки и раскрывашки живут своей жизнью: за них не таскают.
    if (e.button !== 0 || e.target.closest('.btn, .copy, .more, a, [data-dens]')) return;
    st = { x: e.screenX, y: e.screenY, x0: e.screenX, y0: e.screenY, id: e.pointerId, on: false };
    pend = { x: 0, y: 0 };
  });
  document.addEventListener('pointermove', (e) => {
    if (!st) return;
    if (!st.on) {
      if (Math.abs(e.screenX - st.x0) + Math.abs(e.screenY - st.y0) <= DRAG_SLOP) return;
      st.on = true;
      document.body.setPointerCapture(st.id);
    }
    const k = window.devicePixelRatio || 1;   // screenX в CSS-пикселях, окно в физических
    pend.x += (e.screenX - st.x) * k;
    pend.y += (e.screenY - st.y) * k;
    st.x = e.screenX; st.y = e.screenY;
    if (!frame) frame = requestAnimationFrame(flush);
  });
  function end() {
    if (!st) return;
    const dragged = st.on;
    st = null;
    if (!dragged) return;      // просто клик мимо кнопок — ничего не двигали
    flush();
    shell('/move?save=1');
    dragEndedAt = Date.now();
  }
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

// Окно ровно по содержимому: высоту считает страница, размер ставит Go.
// Ширину задаём один раз при старте — так «размер» не зависит от config.json
// на машине оператора (страница — авторитет размера).
const PANEL_WIDTH = 350;   // -30% ширины: сжатый шрифт Bahnschrift позволяет
let widthSet = false;
let lastH = 0;
function fitWindow() {
  if (!widthSet) { widthSet = true; shell('/width?w=' + PANEL_WIDTH); }
  const h = Math.ceil(document.body.getBoundingClientRect().height) + 10;
  if (h === lastH) return;
  lastH = h;
  shell('/height?h=' + h);
}

async function tick() {
  try {
    const r = await fetch(API + '/snapshot?bars=' + density(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    lastGood = d.ts_ms || Date.now();
    paint(d);
    // Время уже в заголовке; здесь индикатор связи + пинг агент<->QUIK.
    $('fresh').className = 'fresh';
    $('fresh').innerHTML = '<span class="lamp">●</span> на связи'
      + (d.ping_ms != null ? ' (' + d.ping_ms + ' мс)' : '');
  } catch (err) {
    $('fresh').className = 'fresh stale';
    $('fresh').innerHTML = '<span class="lamp">●</span> '
      + (lastGood ? 'нет связи, данные от ' + esc(hhmmss(lastGood)) : 'нет связи с STL');
  }
}
tick();
setInterval(tick, 5000);
</script>
